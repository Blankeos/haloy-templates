name: openlivery
server: localhost
targets:
  openlivery:
    image:
      repository: openlivery
      tag: latest
      build_config:
        context: ./openlivery
        push: server
    port: "80"
    domains:
      - domain: app.example.com
  openlivery-db:
    preset: database
    image: postgres:17.6-alpine
    port: "5432"
    env:
      - name: POSTGRES_DB
        value: openlivery
      - name: POSTGRES_USER
        value: openlivery
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
    volumes:
      - openlivery-postgres-data:/var/lib/postgresql/data
  openlivery-api:
    health_check_path: /health
    preset: service
    image: ghcr.io/sarrazola/openlivery-api:v0.4.0
    port: "8080"
    env:
      - name: DATABASE_URL
        from:
          env: OPENLIVERY_API__DATABASE_URL
      - name: SECRET_KEY
        from:
          env: SECRET_KEY
      - name: ENCRYPTION_KEY
        from:
          env: ENCRYPTION_KEY
      - name: WHATSAPP_BRIDGE_TOKEN
        from:
          env: BRIDGE_TOKEN
      - name: FRONTEND_URL
        value: http://app.example.com
      - name: COOKIE_SECURE
        value: "false"
      - name: COOKIE_SAMESITE
        value: lax
      - name: BACKEND_URL
        value: http://openlivery-api:8000
      - name: WHATSAPP_BRIDGE_URL
        value: http://openlivery-whatsapp:3101
      - name: STORAGE_DIR
        value: /app/backend/storage
      - name: ALLOW_MULTI_AGENCY
        value: "false"
    volumes:
      - openlivery-backend-storage:/app/backend/storage
  openlivery-web:
    health_check_path: /login
    preset: service
    image: ghcr.io/sarrazola/openlivery-web:v0.4.0
    port: "8080"
    env:
      - name: BACKEND_INTERNAL_URL
        value: http://openlivery-api:8000
  openlivery-whatsapp:
    preset: service
    image: ghcr.io/sarrazola/openlivery-whatsapp:v0.4.0
    port: "8080"
    env:
      - name: BACKEND_URL
        value: http://openlivery-api:8000
      - name: WHATSAPP_BRIDGE_HOST
        value: 0.0.0.0
      - name: WHATSAPP_BRIDGE_PORT
        value: "3101"
      - name: WHATSAPP_BRIDGE_TOKEN
        from:
          env: BRIDGE_TOKEN
      - name: WHATSAPP_STORE_URL
        from:
          env: OPENLIVERY_WHATSAPP__WHATSAPP_STORE_URL
      - name: WHATSAPP_LOG_LEVEL
        value: silent
