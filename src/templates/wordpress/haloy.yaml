name: wordpress
server: localhost
targets:
  wordpress:
    image:
      repository: wordpress
      tag: latest
      build_config:
        context: ./wordpress
        push: server
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: WORDPRESS_DB_HOST
        value: wordpress-wp-db
      - name: WORDPRESS_DB_NAME
        value: wordpress
      - name: WORDPRESS_DB_USER
        value: root
      - name: WORDPRESS_DB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: WORDPRESS_DEBUG
        value: "0"
      - name: WP_DOMAIN
        value: app.example.com
      - name: WORDPRESS_CONFIG_EXTRA
        value: |
          define('WP_MEMORY_LIMIT', '256M');
          define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress-wp-app:/var/www/html
  wordpress-wp-db:
    preset: database
    image: mysql:8.4
    port: "3306"
    env:
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: DB_PASSWORD
      - name: MYSQL_DATABASE
        value: wordpress
    volumes:
      - wordpress-wp-data:/var/lib/mysql
