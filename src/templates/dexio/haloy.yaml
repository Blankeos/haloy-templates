name: dexio
server: localhost
targets:
  dexio:
    image: ghcr.io/dexio-wiki/dexio:1.0.0
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: DEXIO_PUBLIC_URL
        value: https://app.example.com
      - name: DEXIO_SECRET_KEY
        from:
          env: SECRET_KEY
      - name: DEXIO_DB
        value: /data/dexio.db
      - name: DEXIO_FILES_DIR
        value: /data/files
    volumes:
      - dexio-dexio-data:/data
