name: lowcoder
server: localhost
targets:
  lowcoder-api-service:
    image: lowcoderorg/lowcoder-ce:2.6.4
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: REDIS_ENABLED
        value: "true"
      - name: MONGODB_ENABLED
        value: "true"
      - name: API_SERVICE_ENABLED
        value: "true"
      - name: NODE_SERVICE_ENABLED
        value: "true"
      - name: FRONTEND_ENABLED
        value: "true"
      - name: PUID
        value: "1000"
      - name: PGID
        value: "1000"
      - name: DEFAULT_ORGS_PER_USER
        value: "100"
      - name: DEFAULT_ORG_MEMBER_COUNT
        value: "1000"
      - name: DEFAULT_ORG_GROUP_COUNT
        value: "100"
      - name: DEFAULT_ORG_APP_COUNT
        value: "1000"
      - name: DEFAULT_DEVELOPER_COUNT
        value: "50"
      - name: MONGODB_URL
        value: mongodb://localhost:27017/lowcoder?authSource=admin
      - name: REDIS_URL
        value: redis://localhost:6379
      - name: ENABLE_USER_SIGN_UP
        value: "false"
      - name: ENCRYPTION_PASSWORD
        from:
          env: ENCRYPTION_PASSWORD
      - name: ENCRYPTION_SALT
        from:
          env: ENCRYPTION_SALT
      - name: CORS_ALLOWED_DOMAINS
        value: "*"
      - name: LOWCODER_API_KEY_SECRET
        from:
          env: API_SECRET
      - name: LOWCODER_API_SERVICE_URL
        value: http://localhost:8080
      - name: LOWCODER_NODE_SERVICE_URL
        value: http://localhost:6060
    volumes:
      - lowcoder-volumes-lowcoder-stacks:/lowcoder-stacks
