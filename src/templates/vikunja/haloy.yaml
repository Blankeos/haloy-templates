name: vikunja
server: localhost
targets:
  vikunja:
    image: vikunja/vikunja
    port: "3456"
    domains:
      - domain: app.example.com
    env:
      - name: VIKUNJA_SERVICE_PUBLICURL
        value: https://app.example.com
      - name: VIKUNJA_DATABASE_HOST
        value: vikunja-db
      - name: VIKUNJA_DATABASE_PASSWORD
        from:
          env: DB_PASSWORD
      - name: VIKUNJA_DATABASE_TYPE
        value: postgres
      - name: VIKUNJA_DATABASE_USER
        value: vikunja
      - name: VIKUNJA_DATABASE_DATABASE
        value: vikunja
      - name: VIKUNJA_SERVICE_JWTSECRET
        from:
          env: JWT_SECRET
    volumes:
      - vikunja-vikunja-files:/app/vikunja/files
  vikunja-db:
    preset: database
    image: postgres:17
    port: "5432"
    env:
      - name: POSTGRES_PASSWORD
        from:
          env: DB_PASSWORD
      - name: POSTGRES_USER
        value: vikunja
      - name: POSTGRES_DB
        value: vikunja
    volumes:
      - vikunja-vikunja-db:/var/lib/postgresql/data
