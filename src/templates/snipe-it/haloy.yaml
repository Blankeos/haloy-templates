name: snipe-it
server: localhost
targets:
  snipe-it:
    image: snipe/snipe-it:v8.5.0
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: "false"
      - name: APP_KEY
        from:
          env: APP_KEY
      - name: APP_URL
        value: https://app.example.com
      - name: APP_TIMEZONE
        value: UTC
      - name: APP_LOCALE
        value: en-US
      - name: APP_TRUSTED_PROXIES
        value: 172.0.0.0/8
      - name: APP_FORCE_TLS
        value: "true"
      - name: SECURE_COOKIES
        value: "true"
      - name: PRIVATE_FILESYSTEM_DISK
        value: local
      - name: PUBLIC_FILESYSTEM_DISK
        value: local_public
      - name: DB_CONNECTION
        value: mysql
      - name: DB_HOST
        value: snipe-it-db
      - name: DB_PORT
        value: "3306"
      - name: DB_DATABASE
        value: snipeit
      - name: DB_USERNAME
        value: snipeit
      - name: DB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: DB_PREFIX
        value: "null"
      - name: DB_DUMP_PATH
        value: /usr/bin
      - name: DB_DUMP_SKIP_SSL
        value: "true"
      - name: DB_CHARSET
        value: utf8mb4
      - name: DB_COLLATION
        value: utf8mb4_unicode_ci
      - name: MAIL_MAILER
        value: log
      - name: MAIL_FROM_ADDR
        value: snipe-it@app.example.com
      - name: MAIL_FROM_NAME
        value: Snipe-IT
      - name: MAIL_REPLYTO_ADDR
        value: snipe-it@app.example.com
      - name: MAIL_REPLYTO_NAME
        value: Snipe-IT
      - name: ALLOW_BACKUP_DELETE
        value: "false"
      - name: ALLOW_DATA_PURGE
        value: "false"
      - name: IMAGE_LIB
        value: gd
      - name: LOG_CHANNEL
        value: stderr
      - name: CACHE_DRIVER
        value: file
      - name: SESSION_DRIVER
        value: file
      - name: QUEUE_DRIVER
        value: sync
    volumes:
      - snipe-it-snipe-it-storage:/var/lib/snipeit
  snipe-it-db:
    preset: database
    image: mariadb:11.4.7
    port: "3306"
    env:
      - name: MYSQL_DATABASE
        value: snipeit
      - name: MYSQL_USER
        value: snipeit
      - name: MYSQL_PASSWORD
        from:
          env: DB_PASSWORD
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: MYSQL_ROOT_PASSWORD
    volumes:
      - snipe-it-snipe-it-db-data:/var/lib/mysql
