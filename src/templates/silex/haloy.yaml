name: silex
server: localhost
targets:
  silex:
    image: silexlabs/silex:3.7.0
    port: "6805"
    domains:
      - domain: app.example.com
    env:
      - name: SILEX_URL
        value: http://app.example.com
      - name: SILEX_SESSION_SECRET
        from:
          env: SESSION_SECRET
      - name: STORAGE_CONNECTORS
        value: fs
      - name: HOSTING_CONNECTORS
        value: fs,download
      - name: SILEX_FS_ROOT
        value: /silex/silex/storage
      - name: SILEX_FS_HOSTING_ROOT
        value: /silex/silex/hosting
    volumes:
      - silex-silex-storage:/silex/silex/storage
      - silex-silex-hosting:/silex/silex/hosting
