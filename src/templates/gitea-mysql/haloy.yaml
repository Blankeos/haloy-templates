name: gitea-mysql
server: localhost
targets:
  gitea-mysql-gitea:
    health_check_path: /
    image: docker.gitea.com/gitea:1.24.4
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: USER_UID
        value: "1000"
      - name: USER_GID
        value: "1000"
      - name: GITEA__database__DB_TYPE
        value: mysql
      - name: GITEA__database__HOST
        value: gitea-mysql-mysql:3306
      - name: GITEA__database__NAME
        value: gitea
      - name: GITEA__database__USER
        value: gitea
      - name: GITEA__database__PASSWD
        from:
          env: DB_PASSWORD
    volumes:
      - gitea-mysql-gitea-data:/data
  gitea-mysql-mysql:
    preset: database
    image:
      repository: gitea-mysql-mysql
      tag: latest
      build_config:
        context: ./gitea-mysql-mysql
        push: server
    port: "3306"
    env:
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: DB_ROOT_PASSWORD
      - name: MYSQL_USER
        value: gitea
      - name: MYSQL_PASSWORD
        from:
          env: DB_PASSWORD
      - name: MYSQL_DATABASE
        value: gitea
    volumes:
      - gitea-mysql-mysql-data:/var/lib/mysql
