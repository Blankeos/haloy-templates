name: 3dokploy
server: localhost
targets:
  3dokploy:
    image: ghcr.io/suleyman/3dokploy:0.1.1
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: DOKPLOY_URL
        value: http://host.docker.internal:3000
      - name: BASIC_AUTH
        from:
          env: T_3DOKPLOY__BASIC_AUTH
