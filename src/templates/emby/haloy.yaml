name: emby
server: localhost
targets:
  emby:
    image: emby/embyserver
    port: "8096"
    domains:
      - domain: app.example.com
    env:
      - name: UID
        value: "1000"
      - name: GID
        value: "100"
      - name: GIDLIST
        value: "100"
    volumes:
      - /emby/programdata:/config
      - /emby/series:/mnt/share1
      - /emby/movies:/mnt/share2
