name: imgproxy
server: localhost
targets:
  imgproxy:
    preset: service
    image: darthsim/imgproxy:v3.30.1
    port: "8080"
    env:
      - name: IMGPROXY_KEY
        from:
          env: IMGPROXY_KEY
      - name: IMGPROXY_SALT
        from:
          env: IMGPROXY_SALT
      - name: IMGPROXY_ENABLE_WEBP_DETECTION
        value: "true"
      - name: IMGPROXY_ENFORCE_WEBP
        value: "true"
      - name: IMGPROXY_TTL
        value: "30600"
      - name: IMGPROXY_DEVELOPMENT_ERRORS_MODE
        value: "false"
      - name: IMGPROXY_READ_TIMEOUT
        value: "10"
      - name: IMGPROXY_WRITE_TIMEOUT
        value: "10"
      - name: IMGPROXY_KEEP_ALIVE_TIMEOUT
        value: "10"
      - name: IMGPROXY_DOWNLOAD_TIMEOUT
        value: "5"
      - name: IMGPROXY_MAX_CLIENTS
        value: "10"
      - name: IMGPROXY_USE_ETAG
        value: "true"
      - name: IMGPROXY_QUALITY
        value: "80"
      - name: IMGPROXY_ALLOWED_SOURCES
        value: http://app.example.com,https://app.example.com
      - name: IMGPROXY_ALLOW_ORIGIN
        value: "*"
      - name: IMGPROXY_MAX_SRC_FILE_SIZE
        value: "20971520"
      - name: IMGPROXY_MAX_SRC_RESOLUTION
        value: "50"
      - name: IMGPROXY_LOG_LEVEL
        value: error
  imgproxy-nginx:
    image:
      repository: imgproxy-nginx
      tag: latest
      build_config:
        context: ./imgproxy-nginx
        push: server
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: NGINX_CACHE_LEVELS
        value: 1:2
      - name: NGINX_CACHE_KEYS_ZONE_SIZE
        value: 32m
      - name: NGINX_CACHE_MAX_SIZE
        value: 500m
      - name: NGINX_CACHE_INACTIVE
        value: 30d
      - name: NGINX_CACHE_USE_TEMP_PATH
        value: off
      - name: NGINX_CACHE_EXPIRES
        value: 30d
    volumes:
      - imgproxy-nginx-cache:/tmp/cache
