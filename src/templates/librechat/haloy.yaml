name: librechat
server: localhost
targets:
  librechat:
    image:
      repository: librechat
      tag: latest
      build_config:
        context: ./librechat
        push: server
    port: "3080"
    domains:
      - domain: app.example.com
    env:
      - name: HOST
        value: 0.0.0.0
      - name: PORT
        value: "3080"
      - name: DOMAIN_CLIENT
        value: https://app.example.com
      - name: DOMAIN_SERVER
        value: https://app.example.com
      - name: MONGO_URI
        value: mongodb://librechat-mongodb:27017/LibreChat
      - name: MEILI_HOST
        value: http://librechat-meilisearch:7700
      - name: SEARCH
        value: "true"
      - name: NO_INDEX
        value: "true"
      - name: MEILI_NO_ANALYTICS
        value: "true"
      - name: MEILI_MASTER_KEY
        from:
          env: MEILI_MASTER_KEY
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: JWT_REFRESH_SECRET
        from:
          env: JWT_REFRESH_SECRET
      - name: CREDS_KEY
        value: f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0
      - name: CREDS_IV
        value: e2341419ec3dd3d19b13a1a87fafcbfb
      - name: RAG_PORT
        value: "8000"
      - name: RAG_API_URL
        value: http://librechat-rag-api:8000
      - name: ENDPOINTS
        value: google,openAI,assistants,azureOpenAI,anthropic
      - name: APP_TITLE
        value: LibreChat
      - name: CUSTOM_FOOTER
        value: Made with ❤️ by LibreChat
      - name: ALLOW_EMAIL_LOGIN
        value: "true"
      - name: ALLOW_SOCIAL_LOGIN
        value: "false"
      - name: ALLOW_REGISTRATION
        value: "false"
    volumes:
      - librechat-librechat-data:/app/client/public/images
      - librechat-librechat-data:/app/uploads
      - librechat-librechat-data:/app/logs
  librechat-mongodb:
    preset: database
    image:
      repository: librechat-mongodb
      tag: latest
      build_config:
        context: ./librechat-mongodb
        push: server
    port: "27017"
    volumes:
      - librechat-mongo-data:/data/db
  librechat-meilisearch:
    preset: service
    image: getmeili/meilisearch:v1.12.3
    port: "8080"
    env:
      - name: MEILI_HOST
        value: http://librechat-meilisearch:7700
      - name: MEILI_NO_ANALYTICS
        value: "true"
      - name: MEILI_MASTER_KEY
        from:
          env: MEILI_MASTER_KEY
    volumes:
      - librechat-meili-data:/meili_data
  librechat-vectordb:
    preset: database
    image: pgvector/pgvector:0.8.0-pg15-trixie
    port: "5432"
    env:
      - name: POSTGRES_DB
        value: librechat_db
      - name: POSTGRES_USER
        value: librechat_user
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRESQL_PASSWORD
    volumes:
      - librechat-postgres-data:/var/lib/postgresql/data
  librechat-rag-api:
    preset: service
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    port: "8080"
    env:
      - name: DB_HOST
        value: librechat-vectordb
      - name: VECTOR_DB_TYPE
        value: pgvector
      - name: POSTGRES_DB
        value: librechat_db
      - name: POSTGRES_USER
        value: librechat_user
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRESQL_PASSWORD
      - name: RAG_PORT
        value: "8000"
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: COLLECTION_NAME
        value: librechat_collection
      - name: CHUNK_SIZE
        value: "1500"
      - name: CHUNK_OVERLAP
        value: "100"
      - name: EMBEDDINGS_PROVIDER
        value: openai
      - name: EMBEDDINGS_MODEL
        value: text-embedding-3-small
      - name: DEBUG_RAG_API
        value: "false"
      - name: DEBUG_PGVECTOR_QUERIES
        value: "false"
      - name: CONSOLE_JSON
        value: "false"
