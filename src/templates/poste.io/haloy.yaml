name: poste-io
server: localhost
targets:
  poste-io-mailserver:
    image: analogic/poste.io
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: TZ
        value: UTC
      - name: HTTPS
        value: OFF
      - name: HTTP_PORT
        value: "8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - poste-io-poste-data:/data
