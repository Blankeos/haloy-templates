name: openhands
server: localhost
targets:
  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:latest
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: SANDBOX_RUNTIME_CONTAINER_IMAGE
        value: docker.all-hands.dev/all-hands-ai/runtime:0.50-nikolaik
      - name: WORKSPACE_MOUNT_PATH
        value: /opt/workspace_base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openhands-openhands-config:/.openhands
      - openhands-openhands-workspace:/opt/workspace_base
