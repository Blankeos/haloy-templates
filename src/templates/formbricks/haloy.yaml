name: formbricks
server: localhost
targets:
  formbricks-postgres:
    preset: database
    image: pgvector/pgvector:pg17
    port: "5432"
    env:
      - name: POSTGRES_PASSWORD
        value: postgres
    volumes:
      - formbricks-postgres:/var/lib/postgresql/data
  formbricks:
    image: ghcr.io/formbricks/formbricks:v3.1.5
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: WEBAPP_URL
        value: http://app.example.com
      - name: NEXTAUTH_URL
        value: http://app.example.com
      - name: DATABASE_URL
        value: postgresql://postgres:postgres@formbricks-postgres:5432/formbricks?schema=public
      - name: NEXTAUTH_SECRET
        from:
          env: SECRET_BASE
      - name: ENCRYPTION_KEY
        from:
          env: ENCRYPTION_KEY
      - name: CRON_SECRET
        from:
          env: CRON_SECRET
      - name: EMAIL_VERIFICATION_DISABLED
        value: "1"
      - name: PASSWORD_RESET_DISABLED
        value: "1"
      - name: S3_FORCE_PATH_STYLE
        value: "0"
    volumes:
      - formbricks-uploads:/home/nextjs/apps/web/uploads/
