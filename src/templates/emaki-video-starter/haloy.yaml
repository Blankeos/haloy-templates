name: emaki-video-starter
server: localhost
targets:
  emaki-video-starter:
    health_check_path: /health
    image: san8888/emaki-video-starter:1.0.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: PORT
        value: "3000"
      - name: ACCESS_PASSWORD
        from:
          env: ACCESS_PASSWORD
      - name: EMAKI_MODEL
        value: seedance_2_5
