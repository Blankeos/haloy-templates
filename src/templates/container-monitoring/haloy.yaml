name: container-monitoring
server: localhost
targets:
  container-monitoring-cadvisor:
    preset: service
    image:
      repository: container-monitoring-cadvisor
      tag: latest
      build_config:
        context: ./container-monitoring-cadvisor
        push: server
    port: "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
  container-monitoring-node-exporter:
    preset: service
    image:
      repository: container-monitoring-node-exporter
      tag: latest
      build_config:
        context: ./container-monitoring-node-exporter
        push: server
    port: "8080"
    volumes:
      - /:/host
  container-monitoring-prometheus:
    preset: service
    image:
      repository: container-monitoring-prometheus
      tag: latest
      build_config:
        context: ./container-monitoring-prometheus
        push: server
    port: "8080"
    volumes:
      - container-monitoring-prometheus-data:/prometheus
  container-monitoring-grafana:
    image: grafana/grafana:13.2.4
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: GF_SECURITY_ADMIN_USER
        value: admin
      - name: GF_SECURITY_ADMIN_PASSWORD
        from:
          env: GRAFANA_ADMIN_PASSWORD
      - name: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - name: GF_AUTH_ANONYMOUS_ENABLED
        value: "false"
    volumes:
      - container-monitoring-grafana-data:/var/lib/grafana
