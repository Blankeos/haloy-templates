name: dagu
server: localhost
targets:
  dagu:
    image:
      repository: dagu
      tag: latest
      build_config:
        context: ./dagu
        push: server
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: DAGU_HOST
        value: 0.0.0.0
      - name: DAGU_PORT
        value: "8080"
      - name: DAGU_AUTH_MODE
        value: basic
      - name: DAGU_AUTH_BASIC_USERNAME
        value: admin
      - name: DAGU_AUTH_BASIC_PASSWORD
        from:
          env: ADMIN_PASSWORD
    volumes:
      - dagu-dagu-data:/var/lib/dagu
