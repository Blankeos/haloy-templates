name: vaultwarden
server: localhost
targets:
  vaultwarden:
    image: vaultwarden/server:1.36.0
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: DOMAIN
        value: https://app.example.com
      - name: SIGNUPS_ALLOWED
        value: "true"
    volumes:
      - vaultwarden-vaultwarden:/data
