name: linkwarden
server: localhost
targets:
  linkwarden:
    health_check_path: /
    image: ghcr.io/linkwarden/linkwarden:v2.9.3
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NEXTAUTH_SECRET
        from:
          env: NEXT_SECRET
      - name: NEXTAUTH_URL
        value: http://app.example.com/api/v1/auth
      - name: DATABASE_URL
        from:
          env: LINKWARDEN__DATABASE_URL
    volumes:
      - linkwarden-linkwarden-data:/data/data
  linkwarden-postgres:
    preset: database
    image: postgres:17-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: linkwarden
      - name: POSTGRES_DB
        value: linkwarden
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
    volumes:
      - linkwarden-postgres-data:/var/lib/postgresql/data
