name: coder
server: localhost
targets:
  coder:
    image: ghcr.io/coder/coder:v2.15.3
    port: "7080"
    domains:
      - domain: app.example.com
    env:
      - name: CODER_HTTP_ADDRESS
        value: 0.0.0.0:7080
      - name: CODER_PG_CONNECTION_URL
        from:
          env: CODER__CODER_PG_CONNECTION_URL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  coder-db:
    preset: database
    image: postgres:17
    port: "5432"
    env:
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_USER
        value: coder
      - name: POSTGRES_DB
        value: coder
    volumes:
      - coder-db-coder-data:/var/lib/postgresql/data
