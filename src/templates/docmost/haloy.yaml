name: docmost
server: localhost
targets:
  docmost:
    image: docmost/docmost:0.4.1
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: APP_URL
        value: http://app.example.com:3000
      - name: APP_SECRET
        from:
          env: APP_SECRET
      - name: DATABASE_URL
        from:
          env: DOCMOST__DATABASE_URL
      - name: REDIS_URL
        value: redis://docmost-redis:6379
    volumes:
      - docmost-docmost:/app/data/storage
  docmost-db:
    preset: database
    image: postgres:16-alpine
    port: "5432"
    env:
      - name: POSTGRES_DB
        value: docmost
      - name: POSTGRES_USER
        value: docmost
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
    volumes:
      - docmost-db-docmost-data:/var/lib/postgresql/data
  docmost-redis:
    preset: database
    image: redis:7.2-alpine
    port: "6379"
    volumes:
      - docmost-redis-docmost-data:/data
