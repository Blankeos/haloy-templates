name: cachkey
server: localhost
targets:
  cachkey:
    image: ghcr.io/joyboy-dy/cachkey-web:0.2.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: APP_URL
        value: http://app.example.com
      - name: API_INTERNAL_URL
        value: http://cachkey-api:3001
  cachkey-api:
    preset: service
    image: ghcr.io/joyboy-dy/cachkey-api:0.2.0
    port: "3001"
    env:
      - name: APP_URL
        value: http://app.example.com
      - name: DATABASE_URL
        from:
          env: CACHKEY_API__DATABASE_URL
      - name: BETTER_AUTH_SECRET
        from:
          env: BETTER_AUTH_SECRET
      - name: ENCRYPTION_KEY
        from:
          env: ENCRYPTION_KEY
      - name: EMAIL_PROVIDER
        value: smtp
      - name: EMAIL_FROM
        value: Cachkey <no-reply@example.com>
      - name: SMTP_PORT
        value: "587"
      - name: SMTP_SECURE
        value: "false"
  cachkey-postgres:
    preset: database
    image: postgres:17-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: cachkey
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: cachkey
    volumes:
      - cachkey-postgres-data:/var/lib/postgresql/data
