name: orbit
server: localhost
targets:
  orbit-postgres:
    preset: database
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: orbit
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: orbit
    volumes:
      - orbit-postgres:/var/lib/postgresql
  orbit-redis:
    preset: database
    image:
      repository: orbit-redis
      tag: latest
      build_config:
        context: ./orbit-redis
        push: server
    port: "6379"
    volumes:
      - orbit-redis:/data
  orbit-storage:
    health_check_path: /healthz
    image:
      repository: orbit-storage
      tag: latest
      build_config:
        context: ./orbit-storage
        push: server
    port: "9000"
    domains:
      - domain: app.example.com
    env:
      - name: MINIO_PASSWORD
        from:
          env: MINIO_PASSWORD
    volumes:
      - orbit-storage:/data
  orbit-bucket:
    preset: service
    image:
      repository: orbit-bucket
      tag: latest
      build_config:
        context: ./orbit-bucket
        push: server
    port: "8080"
    env:
      - name: MINIO_PASSWORD
        from:
          env: MINIO_PASSWORD
      - name: ORBIT_APP_URL
        value: https://app.example.com
  orbit-web:
    health_check_path: /api/health
    preset: service
    image: ghcr.io/noveum/orbit-runtime:2026.09.24
    port: "8080"
    env:
      - name: DATABASE_URL
        from:
          env: ORBIT_WEB__DATABASE_URL
      - name: DIRECT_URL
        from:
          env: ORBIT_WEB__DIRECT_URL
      - name: DATABASE_PREPARED_STATEMENTS
        value: "true"
      - name: REDIS_URL
        value: redis://orbit-redis:6379
      - name: BETTER_AUTH_SECRET
        from:
          env: AUTH_SECRET
      - name: BETTER_AUTH_URL
        value: https://app.example.com
      - name: NEXT_PUBLIC_APP_URL
        value: https://app.example.com
      - name: ORBIT_PASSWORD_AUTH
        value: "true"
      - name: EMAIL_FROM
        value: Orbit <auth@orbit.local>
      - name: SLACK_ENABLED
        value: "false"
      - name: CRON_SECRET
        from:
          env: CRON_SECRET
      - name: ORBIT_SELF_HOSTED
        value: "true"
      - name: S3_ENDPOINT
        value: https://app.example.com
      - name: S3_REGION
        value: us-east-1
      - name: S3_BUCKET
        value: orbit-uploads
      - name: S3_ACCESS_KEY_ID
        value: orbit
      - name: S3_SECRET_ACCESS_KEY
        from:
          env: MINIO_PASSWORD
      - name: NEXT_TELEMETRY_DISABLED
        value: "1"
  orbit-realtime:
    health_check_path: /health
    preset: service
    image:
      repository: orbit-realtime
      tag: latest
      build_config:
        context: ./orbit-realtime
        push: server
    port: "8080"
    env:
      - name: DATABASE_URL
        from:
          env: ORBIT_REALTIME__DATABASE_URL
      - name: DIRECT_URL
        from:
          env: ORBIT_REALTIME__DIRECT_URL
      - name: DATABASE_PREPARED_STATEMENTS
        value: "true"
      - name: REDIS_URL
        value: redis://orbit-redis:6379
      - name: BETTER_AUTH_SECRET
        from:
          env: AUTH_SECRET
      - name: BETTER_AUTH_URL
        value: https://app.example.com
      - name: NEXT_PUBLIC_APP_URL
        value: https://app.example.com
      - name: ORBIT_PASSWORD_AUTH
        value: "true"
      - name: EMAIL_FROM
        value: Orbit <auth@orbit.local>
      - name: SLACK_ENABLED
        value: "false"
      - name: CRON_SECRET
        from:
          env: CRON_SECRET
      - name: ORBIT_SELF_HOSTED
        value: "true"
      - name: S3_ENDPOINT
        value: https://app.example.com
      - name: S3_REGION
        value: us-east-1
      - name: S3_BUCKET
        value: orbit-uploads
      - name: S3_ACCESS_KEY_ID
        value: orbit
      - name: S3_SECRET_ACCESS_KEY
        from:
          env: MINIO_PASSWORD
      - name: NEXT_TELEMETRY_DISABLED
        value: "1"
  orbit-scheduler:
    preset: service
    image:
      repository: orbit-scheduler
      tag: latest
      build_config:
        context: ./orbit-scheduler
        push: server
    port: "8080"
    env:
      - name: CRON_SECRET
        from:
          env: CRON_SECRET
      - name: ORBIT_INTERNAL_URL
        value: http://orbit-web:3000
  orbit:
    image: ghcr.io/noveum/orbit-gateway:2026.09.24
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: ORBIT_TRUSTED_PROXIES
        value: private_ranges
