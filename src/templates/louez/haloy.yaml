name: louez
server: localhost
targets:
  louez:
    image: synapsr/louez:2.1.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: LOUEZ_MODE
        value: standalone
      - name: DATABASE_URL
        from:
          env: LOUEZ__DATABASE_URL
      - name: AUTH_URL
        value: https://app.example.com
      - name: AUTH_TRUST_HOST
        value: "true"
      - name: NEXT_PUBLIC_APP_URL
        value: https://app.example.com
      - name: NEXT_PUBLIC_APP_DOMAIN
        value: app.example.com
      - name: S3_ENDPOINT
        value: http://louez-minio:9000
      - name: S3_REGION
        value: us-east-1
      - name: S3_BUCKET
        value: louez
      - name: S3_ACCESS_KEY_ID
        value: louez
      - name: S3_SECRET_ACCESS_KEY
        from:
          env: INLINE_PASSWORD_32
      - name: S3_PUBLIC_URL
        value: /files
    volumes:
      - louez-louez-data:/app/data
  louez-mysql:
    preset: database
    image: mysql:8.4
    port: "3306"
    env:
      - name: MYSQL_DATABASE
        value: louez
      - name: MYSQL_USER
        value: louez
      - name: MYSQL_PASSWORD
        from:
          env: INLINE_PASSWORD_32
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: INLINE_PASSWORD_32
    volumes:
      - louez-mysql-data:/var/lib/mysql
  louez-minio:
    health_check_path: /minio/health/live
    preset: service
    image:
      repository: louez-minio
      tag: latest
      build_config:
        context: ./louez-minio
        push: server
    port: "8080"
    env:
      - name: MINIO_ROOT_USER
        value: louez
      - name: MINIO_ROOT_PASSWORD
        from:
          env: INLINE_PASSWORD_32
    volumes:
      - louez-minio-data:/data
