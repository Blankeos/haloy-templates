name: evershop
server: localhost
targets:
  evershop-app:
    image: evershop/evershop:latest
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: DB_HOST
        value: evershop-database
      - name: DB_PORT
        value: "5432"
      - name: DB_PASSWORD
        value: postgres
      - name: DB_USER
        value: postgres
      - name: DB_NAME
        value: evershop
  evershop-database:
    preset: database
    image: postgres:16
    port: "5432"
    env:
      - name: POSTGRES_PASSWORD
        value: postgres
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_DB
        value: evershop
    volumes:
      - evershop-postgres-data:/var/lib/postgresql/data
