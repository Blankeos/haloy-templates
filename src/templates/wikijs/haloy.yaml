name: wikijs
server: localhost
targets:
  wikijs-wiki:
    image: ghcr.io/requarks/wiki:2.5
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: DB_TYPE
        value: postgres
      - name: DB_HOST
        value: wikijs-db
      - name: DB_PORT
        value: "5432"
      - name: DB_USER
        value: wikijs
      - name: DB_PASS
        value: wikijsrocks
      - name: DB_NAME
        value: wiki
  wikijs-db:
    preset: database
    image: postgres:14
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: wikijs
      - name: POSTGRES_PASSWORD
        value: wikijsrocks
      - name: POSTGRES_DB
        value: wiki
    volumes:
      - wikijs-wiki-db-data:/var/lib/postgresql/data
