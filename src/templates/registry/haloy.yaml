name: registry
server: localhost
targets:
  registry:
    health_check_path: /
    image:
      repository: registry
      tag: latest
      build_config:
        context: ./registry
        push: server
    port: "5000"
    domains:
      - domain: app.example.com
    env:
      - name: USERNAME
        value: admin
      - name: PASSWORD
        from:
          env: PASSWORD
      - name: REGISTRY_AUTH
        value: htpasswd
      - name: REGISTRY_AUTH_HTPASSWD_REALM
        value: Registry Realm
      - name: REGISTRY_AUTH_HTPASSWD_PATH
        value: /auth/registry.password
      - name: REGISTRY_HTTP_RELATIVEURLS
        value: "true"
    volumes:
      - registry-registry-data:/var/lib/registry
