name: rustrak-full
server: localhost
targets:
  rustrak-full-rustrak-server:
    image: rustrak/rustrak-server:postgres
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: HOST
        value: 0.0.0.0
      - name: PORT
        value: "8080"
      - name: RUST_LOG
        value: info
      - name: SSL_PROXY
        value: "true"
      - name: DATABASE_URL
        from:
          env: RUSTRAK_FULL_RUSTRAK_SERVER__DATABASE_URL
      - name: SESSION_SECRET_KEY
        from:
          env: SESSION_SECRET_KEY
      - name: CREATE_SUPERUSER
        from:
          env: RUSTRAK_FULL_RUSTRAK_SERVER__CREATE_SUPERUSER
  rustrak-full-rustrak-ui:
    image: rustrak/rustrak-ui:latest
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: RUSTRAK_API_URL
        value: https://app.example.com
      - name: HOSTNAME
        value: 0.0.0.0
  rustrak-full-postgres:
    preset: database
    image: postgres:16-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: rustrak
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: rustrak
    volumes:
      - rustrak-full-postgres-data:/var/lib/postgresql/data
