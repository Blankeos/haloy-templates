name: photoprism
server: localhost
targets:
  photoprism:
    image: photoprism/photoprism:latest
    port: "2342"
    domains:
      - domain: app.example.com
    env:
      - name: PHOTOPRISM_ADMIN_USER
        value: admin
      - name: PHOTOPRISM_ADMIN_PASSWORD
        from:
          env: ADMIN_PASSWORD
      - name: PHOTOPRISM_AUTH_MODE
        value: password
      - name: PHOTOPRISM_SITE_URL
        value: http://localhost:2342/
      - name: PHOTOPRISM_DISABLE_TLS
        value: "false"
      - name: PHOTOPRISM_DEFAULT_TLS
        value: "false"
      - name: PHOTOPRISM_ORIGINALS_LIMIT
        value: "5000"
      - name: PHOTOPRISM_HTTP_COMPRESSION
        value: gzip
      - name: PHOTOPRISM_LOG_LEVEL
        value: info
      - name: PHOTOPRISM_READONLY
        value: "false"
      - name: PHOTOPRISM_EXPERIMENTAL
        value: "false"
      - name: PHOTOPRISM_DISABLE_CHOWN
        value: "false"
      - name: PHOTOPRISM_DISABLE_WEBDAV
        value: "false"
      - name: PHOTOPRISM_DISABLE_SETTINGS
        value: "false"
      - name: PHOTOPRISM_DISABLE_TENSORFLOW
        value: "false"
      - name: PHOTOPRISM_DISABLE_FACES
        value: "false"
      - name: PHOTOPRISM_DISABLE_CLASSIFICATION
        value: "false"
      - name: PHOTOPRISM_DISABLE_VECTORS
        value: "false"
      - name: PHOTOPRISM_DISABLE_RAW
        value: "false"
      - name: PHOTOPRISM_RAW_PRESETS
        value: "false"
      - name: PHOTOPRISM_SIDECAR_YAML
        value: "true"
      - name: PHOTOPRISM_BACKUP_ALBUMS
        value: "true"
      - name: PHOTOPRISM_BACKUP_DATABASE
        value: "true"
      - name: PHOTOPRISM_BACKUP_SCHEDULE
        value: daily
      - name: PHOTOPRISM_AUTO_INDEX
        value: "300"
      - name: PHOTOPRISM_AUTO_IMPORT
        value: "-1"
      - name: PHOTOPRISM_DETECT_NSFW
        value: "false"
      - name: PHOTOPRISM_UPLOAD_NSFW
        value: "true"
      - name: PHOTOPRISM_DATABASE_DRIVER
        value: mysql
      - name: PHOTOPRISM_DATABASE_SERVER
        value: photoprism-mariadb:3306
      - name: PHOTOPRISM_DATABASE_NAME
        value: photoprism
      - name: PHOTOPRISM_DATABASE_USER
        value: photoprism
      - name: PHOTOPRISM_DATABASE_PASSWORD
        value: insecure
      - name: PHOTOPRISM_SITE_CAPTION
        value: AI-Powered Photos App
    volumes:
      - photoprism-pictures:/photoprism/originals
      - photoprism-storage-data:/photoprism/storage
  photoprism-mariadb:
    preset: database
    image: mariadb:11
    port: "3306"
    env:
      - name: MARIADB_AUTO_UPGRADE
        value: "1"
      - name: MARIADB_INITDB_SKIP_TZINFO
        value: "1"
      - name: MARIADB_DATABASE
        value: photoprism
      - name: MARIADB_USER
        value: photoprism
      - name: MARIADB_PASSWORD
        value: insecure
      - name: MARIADB_ROOT_PASSWORD
        value: insecure
    volumes:
      - photoprism-db-data:/var/lib/mysql
