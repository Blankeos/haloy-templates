name: fider
server: localhost
targets:
  fider-db:
    preset: database
    image: postgres:17
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: fider
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: fider
    volumes:
      - fider-fiderpostgresdata:/var/lib/postgresql/data
  fider:
    image: getfider/fider:0.21.1
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: BASE_URL
        value: https://app.example.com
      - name: DATABASE_URL
        from:
          env: FIDER__DATABASE_URL
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: EMAIL
        value: smtp
      - name: EMAIL_NOREPLY
        value: noreply@app.example.com
      - name: EMAIL_SMTP_HOST
        value: fider-mailhog
      - name: EMAIL_SMTP_PORT
        value: "1025"
      - name: EMAIL_SMTP_ENABLE_STARTTLS
        value: "true"
  fider-mailhog:
    preset: service
    image: mailhog/mailhog:v1.0.1
    port: "8080"
