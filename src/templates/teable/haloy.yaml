name: teable
server: localhost
targets:
  teable:
    image: ghcr.io/teableio/teable:latest
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: TZ
        value: UTC
      - name: NEXT_ENV_IMAGES_ALL_REMOTE
        value: "true"
      - name: PUBLIC_ORIGIN
        value: https://app.example.com
      - name: PRISMA_DATABASE_URL
        from:
          env: TEABLE__PRISMA_DATABASE_URL
      - name: PUBLIC_DATABASE_PROXY
        value: app.example.com:8080
    volumes:
      - teable-teable-data:/app/.assets
  teable-db:
    preset: database
    image: postgres:15.4
    port: "5432"
    env:
      - name: TZ
        value: UTC
      - name: POSTGRES_DB
        value: teable
      - name: POSTGRES_USER
        value: teable
      - name: POSTGRES_PASSWORD
        from:
          env: DB_PASSWORD
    volumes:
      - teable-teable-db:/var/lib/postgresql/data
  teable-db-migrate:
    preset: service
    image: ghcr.io/teableio/teable-db-migrate:latest
    port: "8080"
    env:
      - name: TZ
        value: UTC
      - name: PRISMA_DATABASE_URL
        from:
          env: TEABLE_DB_MIGRATE__PRISMA_DATABASE_URL
