name: kotonoba
server: localhost
targets:
  kotonoba:
    image: ghcr.io/trixtylab/kotonoba:1.0.19
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NODE_ENV
        value: production
      - name: DB_PATH
        value: /app/data/kotonoba.db
      - name: UPLOAD_DIR
        value: /app/data/uploads
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: SITE_URL
        value: https://app.example.com
      - name: ADMIN_DOMAIN
        value: app.example.com
    volumes:
      - kotonoba-blog-data:/app/data
