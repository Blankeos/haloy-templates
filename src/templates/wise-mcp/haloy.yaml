name: wise-mcp
server: localhost
targets:
  wise-mcp:
    image: ghcr.io/blanketbyte/wise-mcp:1.1.1
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: PUBLIC_URL
        value: https://app.example.com
      - name: TOKEN_ENCRYPTION_KEY
        from:
          env: ENCRYPTION_KEY
      - name: WRITES_ENABLED
        value: "true"
    volumes:
      - wise-mcp-wise-mcp-data:/data
