name: kestra
server: localhost
targets:
  kestra-postgres:
    preset: database
    image: postgres
    port: "5432"
    env:
      - name: POSTGRES_DB
        value: kestra
      - name: POSTGRES_USER
        value: kestra
      - name: POSTGRES_PASSWORD
        value: k3str4
    volumes:
      - kestra-postgres-data:/var/lib/postgresql/data
  kestra:
    image:
      repository: kestra
      tag: latest
      build_config:
        context: ./kestra
        push: server
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: KESTRA_CONFIGURATION
        value: |
          datasources:
            postgres:
              url: jdbc:postgresql://kestra-postgres:5432/kestra
              driverClassName: org.postgresql.Driver
              username: kestra
              password: k3str4
          kestra:
            server:
              basicAuth:
                enabled: false
                username: "admin@localhost.dev" # it must be a valid email address
                password: k3str4p@ss
            repository:
              type: postgres
            storage:
              type: local
              local:
                basePath: "/app/storage"
            queue:
              type: postgres
            tasks:
              tmpDir:
                path: /tmp/kestra-wd/tmp
            url: http://localhost:8080/
    volumes:
      - kestra-kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
