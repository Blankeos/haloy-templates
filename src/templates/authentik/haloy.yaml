name: authentik
server: localhost
targets:
  authentik-postgresql:
    preset: database
    image: docker.io/library/postgres:18-alpine
    port: "5432"
    env:
      - name: POSTGRES_PASSWORD
        from:
          env: INLINE_PASSWORD_32
      - name: POSTGRES_USER
        value: authentik
      - name: POSTGRES_DB
        value: authentik
    volumes:
      - authentik-database:/var/lib/postgresql
  authentik-server:
    image:
      repository: authentik-server
      tag: latest
      build_config:
        context: ./authentik-server
        push: server
    port: "9000"
    domains:
      - domain: app.example.com
    env:
      - name: AUTHENTIK_SECRET_KEY
        from:
          env: INLINE_PASSWORD_64
      - name: AUTHENTIK_WEB__BASE_URL
        value: https://app.example.com
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik-postgresql
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        from:
          env: INLINE_PASSWORD_32
    volumes:
      - authentik-data:/data
      - authentik-custom-templates:/templates
  authentik-worker:
    preset: service
    image:
      repository: authentik-worker
      tag: latest
      build_config:
        context: ./authentik-worker
        push: server
    port: "8080"
    env:
      - name: AUTHENTIK_SECRET_KEY
        from:
          env: INLINE_PASSWORD_64
      - name: AUTHENTIK_WEB__BASE_URL
        value: https://app.example.com
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: authentik-postgresql
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        from:
          env: INLINE_PASSWORD_32
    volumes:
      - authentik-data:/data
      - authentik-certs:/certs
      - authentik-custom-templates:/templates
