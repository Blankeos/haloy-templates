name: sync upstream
on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run sync
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Open a PR if anything changed
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git diff --quiet && git ls-files --others --exclude-standard | grep -q . || {
            branch="sync/$(date +%Y-%m-%d)"
            git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
            git checkout -b "$branch"; git add -A; git commit -m "chore: sync Dokploy templates"
            git push -u origin "$branch"
            gh pr create --title "Sync Dokploy templates" --body "Automated sync. CI validates every template with the real haloy CLI. See COVERAGE.md for the summary." --base main
          }
