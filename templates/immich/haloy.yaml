name: immich
server: localhost
targets:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.0.2
    port: "2283"
    domains:
      - domain: app.example.com
    env:
      - name: DB_HOSTNAME
        value: immich-database
      - name: DB_PORT
        value: "5432"
      - name: DB_USERNAME
        value: immich
      - name: DB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: DB_DATABASE_NAME
        value: immich
      - name: REDIS_HOSTNAME
        value: immich-redis
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_DBINDEX
        value: "0"
      - name: TZ
        value: UTC
    volumes:
      - immich-immich-library:/data
      - /etc/localtime:/etc/localtime:ro
  immich-machine-learning:
    preset: service
    image:
      repository: immich-machine-learning
      tag: latest
      build_config:
        context: ./immich-machine-learning
        push: server
    port: "8080"
    volumes:
      - immich-immich-model-cache:/cache
  immich-redis:
    preset: database
    image: valkey/valkey:9
    port: "6379"
    volumes:
      - immich-immich-redis-data:/data
  immich-database:
    preset: database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    port: "5432"
    env:
      - name: POSTGRES_PASSWORD
        from:
          env: DB_PASSWORD
      - name: POSTGRES_USER
        value: immich
      - name: POSTGRES_DB
        value: immich
      - name: POSTGRES_INITDB_ARGS
        value: --data-checksums
    volumes:
      - immich-immich-postgres:/var/lib/postgresql/data
