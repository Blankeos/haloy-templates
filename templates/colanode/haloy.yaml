name: colanode
server: localhost
targets:
  colanode-postgres:
    preset: database
    image: pgvector/pgvector:pg17
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: colanode_user
      - name: POSTGRES_PASSWORD
        value: your_postgres_password
      - name: POSTGRES_DB
        value: colanode_db
    volumes:
      - colanode-postgres-data:/var/lib/postgresql/data
  colanode-valkey:
    preset: database
    image:
      repository: colanode-valkey
      tag: latest
      build_config:
        context: ./colanode-valkey
        push: server
    port: "6379"
    volumes:
      - colanode-valkey-data:/data
  colanode-minio:
    health_check_path: /minio/health/live
    preset: service
    image:
      repository: colanode-minio
      tag: latest
      build_config:
        context: ./colanode-minio
        push: server
    port: "8080"
    env:
      - name: MINIO_ROOT_USER
        value: admin
      - name: MINIO_ROOT_PASSWORD
        value: your_minio_password
      - name: MINIO_BROWSER
        value: on
      - name: MINIO_DOMAIN
        value: colanode-minio
      - name: MINIO_ADDRESS
        value: :9000
      - name: MINIO_CONSOLE_ADDRESS
        value: :9001
    volumes:
      - colanode-minio-data:/data
  colanode-server:
    image: ghcr.io/colanode/server:latest
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "3000"
      - name: SERVER_NAME
        value: My Colanode
      - name: SERVER_AVATAR
        value: https://colanode.com/assets/logo-black.png
      - name: SERVER_MODE
        value: standalone
      - name: ACCOUNT_VERIFICATION_TYPE
        value: automatic
      - name: ACCOUNT_OTP_TIMEOUT
        value: "600"
      - name: ACCOUNT_ALLOW_GOOGLE_LOGIN
        value: "false"
      - name: USER_STORAGE_LIMIT
        value: "10737418240"
      - name: USER_MAX_FILE_SIZE
        value: "104857600"
      - name: POSTGRES_URL
        value: postgres://colanode_user:your_postgres_password@colanode-postgres:5432/colanode_db
      - name: REDIS_URL
        value: redis://:your_valkey_password@colanode-valkey:6379/0
      - name: REDIS_DB
        value: "0"
      - name: REDIS_JOBS_QUEUE_NAME
        value: jobs
      - name: REDIS_JOBS_QUEUE_PREFIX
        value: colanode
      - name: REDIS_EVENTS_CHANNEL
        value: events
      - name: S3_AVATARS_ENDPOINT
        value: http://colanode-minio:9000
      - name: S3_AVATARS_ACCESS_KEY
        value: admin
      - name: S3_AVATARS_SECRET_KEY
        value: your_minio_password
      - name: S3_AVATARS_BUCKET_NAME
        value: colanode-avatars
      - name: S3_AVATARS_REGION
        value: us-east-1
      - name: S3_AVATARS_FORCE_PATH_STYLE
        value: "true"
      - name: STORAGE_S3_ENDPOINT
        value: http://colanode-minio:9000
      - name: STORAGE_S3_ACCESS_KEY
        value: admin
      - name: STORAGE_S3_SECRET_KEY
        value: your_minio_password
      - name: STORAGE_S3_BUCKET
        value: colanode-files
      - name: STORAGE_S3_REGION
        value: us-east-1
      - name: STORAGE_S3_FORCE_PATH_STYLE
        value: "true"
      - name: SMTP_ENABLED
        value: "false"
      - name: SMTP_HOST
        value: smtp.gmail.com
      - name: SMTP_PORT
        value: "587"
      - name: SMTP_USER
        value: your_smtp_username
      - name: SMTP_PASSWORD
        value: your_smtp_password
      - name: SMTP_EMAIL_FROM
        value: your_email@example.com
      - name: SMTP_EMAIL_FROM_NAME
        value: Colanode
      - name: AI_ENABLED
        value: "false"
