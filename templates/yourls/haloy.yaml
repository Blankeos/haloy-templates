name: yourls
server: localhost
targets:
  yourls-app:
    image: yourls:1.9.2
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: YOURLS_SITE
        value: https://app.example.com
      - name: YOURLS_USER
        value: admin
      - name: YOURLS_PASS
        from:
          env: ADMIN_PASSWORD
      - name: YOURLS_DB_HOST
        value: yourls-mysql
      - name: YOURLS_DB_USER
        value: yourls
      - name: YOURLS_DB_PASS
        from:
          env: MYSQL_PASSWORD
      - name: YOURLS_DB_NAME
        value: yourls
    volumes:
      - yourls-yourls-data:/var/www/html
  yourls-mysql:
    preset: database
    image: mysql:5.7
    port: "3306"
    env:
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: MYSQL_ROOT_PASSWORD
      - name: MYSQL_DATABASE
        value: yourls
      - name: MYSQL_USER
        value: yourls
      - name: MYSQL_PASSWORD
        from:
          env: MYSQL_PASSWORD
    volumes:
      - yourls-yourls-mysql-data:/var/lib/mysql
