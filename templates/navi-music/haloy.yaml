name: navi-music
server: localhost
targets:
  navi-music:
    preset: service
    image:
      repository: navi-music
      tag: latest
      build_config:
        context: ./navi-music
        push: server
    port: "8080"
    env:
      - name: YOUTUBE_CIPHER_URL
        value: http://navi-music-yt-cipher:8001
      - name: YOUTUBE_CIPHER_PASSWORD
        from:
          env: INLINE_PASSWORD_32
  navi-music-yt-cipher:
    preset: service
    image:
      repository: navi-music-yt-cipher
      tag: latest
      build_config:
        context: ./navi-music-yt-cipher
        push: server
    port: "8080"
    env:
      - name: OVERRIDE_PLAYER_VARIANT
        value: IAS
      - name: API_TOKEN
        from:
          env: INLINE_PASSWORD_32
