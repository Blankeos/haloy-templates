name: gitea-postgres
server: localhost
targets:
  gitea-postgres-gitea:
    health_check_path: /api/healthz
    image: docker.gitea.com/gitea:1.27.3
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: USER_UID
        value: "1000"
      - name: USER_GID
        value: "1000"
      - name: GITEA__database__DB_TYPE
        value: postgres
      - name: GITEA__database__HOST
        value: gitea-postgres-postgres:5432
      - name: GITEA__database__NAME
        value: gitea
      - name: GITEA__database__USER
        value: admin
      - name: GITEA__database__PASSWD
        from:
          env: DB_PASSWORD
      - name: GITEA__server__DOMAIN
        value: app.example.com
      - name: GITEA__server__SSH_DOMAIN
        value: app.example.com}
      - name: GITEA__server__ROOT_URL
        value: https://app.example.com/
      - name: GITEA__server__LFS_START_SERVER
        value: "true"
      - name: GITEA__service__DISABLE_REGISTRATION
        value: "false"
      - name: GITEA__service__REQUIRE_SIGNIN_VIEW
        value: "false"
    volumes:
      - gitea-postgres-gitea-data:/data
  gitea-postgres-postgres:
    preset: database
    image: postgres:16-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: admin
      - name: POSTGRES_PASSWORD
        from:
          env: DB_PASSWORD
      - name: POSTGRES_DB
        value: gitea
    volumes:
      - gitea-postgres-pg-data:/var/lib/postgresql/data
