name: supabase
server: localhost
targets:
  supabase-studio:
    health_check_path: /api/platform/profile
    preset: service
    image:
      repository: supabase-studio
      tag: latest
      build_config:
        context: ./supabase-studio
        push: server
    port: "8080"
    env:
      - name: HOSTNAME
        value: 0.0.0.0
      - name: STUDIO_PG_META_URL
        value: http://supabase-meta:8080
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_HOST
        value: supabase-db
      - name: POSTGRES_DB
        value: postgres
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_USER_READ_WRITE
        value: postgres
      - name: PG_META_CRYPTO_KEY
        from:
          env: PG_META_CRYPTO_KEY
      - name: PGRST_DB_SCHEMAS
        value: public,storage,graphql_public
      - name: PGRST_DB_MAX_ROWS
        value: "1000"
      - name: PGRST_DB_EXTRA_SEARCH_PATH
        value: public
      - name: DEFAULT_ORGANIZATION_NAME
        value: Default Organization
      - name: DEFAULT_PROJECT_NAME
        value: Default Project
      - name: SUPABASE_URL
        value: http://supabase-api-gw:8000
      - name: SUPABASE_PUBLIC_URL
        value: https://app.example.com
      - name: SUPABASE_ANON_KEY
        from:
          env: SUPABASE_STUDIO__SUPABASE_ANON_KEY
      - name: SUPABASE_SERVICE_KEY
        from:
          env: SUPABASE_STUDIO__SUPABASE_SERVICE_KEY
      - name: AUTH_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: SUPABASE_PUBLISHABLE_KEY
        from:
          env: SUPABASE_STUDIO__SUPABASE_PUBLISHABLE_KEY
      - name: SUPABASE_SECRET_KEY
        from:
          env: SUPABASE_STUDIO__SUPABASE_SECRET_KEY
      - name: ENABLED_FEATURES_LOGS_ALL
        value: "false"
      - name: SNIPPETS_MANAGEMENT_FOLDER
        value: /app/snippets
      - name: EDGE_FUNCTIONS_MANAGEMENT_FOLDER
        value: /app/edge-functions
    volumes:
      - supabase-volumes-snippets:/app/snippets
      - supabase-volumes-functions:/app/edge-functions
  supabase-api-gw:
    image:
      repository: supabase-api-gw
      tag: latest
      build_config:
        context: ./supabase-api-gw
        push: server
    port: "8000"
    domains:
      - domain: app.example.com
    env:
      - name: ANON_KEY
        from:
          env: ANON_KEY
      - name: SERVICE_ROLE_KEY
        from:
          env: SERVICE_ROLE_KEY
      - name: SUPABASE_PUBLISHABLE_KEY
        from:
          env: SUPABASE_API_GW__SUPABASE_PUBLISHABLE_KEY
      - name: SUPABASE_SECRET_KEY
        from:
          env: SUPABASE_API_GW__SUPABASE_SECRET_KEY
      - name: ANON_KEY_ASYMMETRIC
        from:
          env: ANON_KEY
      - name: SERVICE_ROLE_KEY_ASYMMETRIC
        from:
          env: SERVICE_ROLE_KEY
      - name: SUPABASE_PUBLIC_URL
        value: https://app.example.com
      - name: DASHBOARD_USERNAME
        value: supabase
      - name: DASHBOARD_PASSWORD
        from:
          env: DASHBOARD_PASSWORD
  supabase-auth:
    health_check_path: /health
    preset: service
    image:
      repository: supabase-auth
      tag: latest
      build_config:
        context: ./supabase-auth
        push: server
    port: "8080"
    env:
      - name: GOTRUE_MAILER_EXTERNAL_HOSTS
        value: api-gw,app.example.com
      - name: GOTRUE_API_HOST
        value: 0.0.0.0
      - name: GOTRUE_API_PORT
        value: "9999"
      - name: API_EXTERNAL_URL
        value: https://app.example.com/auth/v1
      - name: GOTRUE_DB_DRIVER
        value: postgres
      - name: GOTRUE_DB_DATABASE_URL
        from:
          env: SUPABASE_AUTH__GOTRUE_DB_DATABASE_URL
      - name: GOTRUE_SITE_URL
        value: http://localhost:3000
      - name: GOTRUE_URI_ALLOW_LIST
        value: https://app.example.com/*,http://localhost:3000/*
      - name: GOTRUE_DISABLE_SIGNUP
        value: "false"
      - name: GOTRUE_JWT_ADMIN_ROLES
        value: service_role
      - name: GOTRUE_JWT_AUD
        value: authenticated
      - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
        value: authenticated
      - name: GOTRUE_JWT_EXP
        value: "3600"
      - name: GOTRUE_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: GOTRUE_JWT_KEYS
        value: "[]"
      - name: GOTRUE_JWT_ISSUER
        value: https://app.example.com/auth/v1
      - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
        value: "true"
      - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
        value: "false"
      - name: GOTRUE_MAILER_AUTOCONFIRM
        value: "false"
      - name: GOTRUE_SMTP_ADMIN_EMAIL
        value: admin@example.com
      - name: GOTRUE_SMTP_HOST
        value: supabase-mail
      - name: GOTRUE_SMTP_PORT
        value: "2500"
      - name: GOTRUE_SMTP_USER
        value: fake_mail_user
      - name: GOTRUE_SMTP_PASS
        value: fake_mail_password
      - name: GOTRUE_SMTP_SENDER_NAME
        value: fake_sender
      - name: GOTRUE_MAILER_URLPATHS_INVITE
        value: '"/auth/v1/verify"'
      - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
        value: '"/auth/v1/verify"'
      - name: GOTRUE_MAILER_URLPATHS_RECOVERY
        value: '"/auth/v1/verify"'
      - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
        value: '"/auth/v1/verify"'
      - name: GOTRUE_EXTERNAL_PHONE_ENABLED
        value: "true"
      - name: GOTRUE_SMS_AUTOCONFIRM
        value: "true"
  supabase-rest:
    preset: service
    image:
      repository: supabase-rest
      tag: latest
      build_config:
        context: ./supabase-rest
        push: server
    port: "8080"
    env:
      - name: PGRST_DB_URI
        from:
          env: SUPABASE_REST__PGRST_DB_URI
      - name: PGRST_DB_SCHEMAS
        value: public,storage,graphql_public
      - name: PGRST_DB_MAX_ROWS
        value: "1000"
      - name: PGRST_DB_EXTRA_SEARCH_PATH
        value: public
      - name: PGRST_DB_ANON_ROLE
        value: anon
      - name: PGRST_ADMIN_SERVER_PORT
        value: "3001"
      - name: PGRST_ADMIN_SERVER_HOST
        value: localhost
      - name: PGRST_JWT_SECRET
        value: "}"
      - name: PGRST_DB_USE_LEGACY_GUCS
        value: "false"
      - name: PGRST_APP_SETTINGS_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: PGRST_APP_SETTINGS_JWT_EXP
        value: "3600"
  supabase-realtime:
    health_check_path: /api/tenants/realtime-dev/health
    preset: service
    image:
      repository: supabase-realtime
      tag: latest
      build_config:
        context: ./supabase-realtime
        push: server
    port: "8080"
    env:
      - name: PORT
        value: "4000"
      - name: DB_HOST
        value: supabase-db
      - name: DB_PORT
        value: "5432"
      - name: DB_USER
        value: supabase_admin
      - name: DB_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: DB_NAME
        value: postgres
      - name: DB_AFTER_CONNECT_QUERY
        value: SET search_path TO _realtime
      - name: DB_ENC_KEY
        from:
          env: REALTIME_DB_ENC_KEY
      - name: API_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: API_JWT_JWKS
        value: "}"
      - name: SECRET_KEY_BASE
        from:
          env: SECRET_KEY_BASE
      - name: METRICS_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: ERL_AFLAGS
        value: -proto_dist inet_tcp
      - name: DNS_NODES
        value: "''"
      - name: RLIMIT_NOFILE
        value: "10000"
      - name: APP_NAME
        value: realtime
      - name: SEED_SELF_HOST
        value: "true"
      - name: RUN_JANITOR
        value: "true"
      - name: DISABLE_HEALTHCHECK_LOGGING
        value: "true"
  supabase-storage:
    preset: service
    image:
      repository: supabase-storage
      tag: latest
      build_config:
        context: ./supabase-storage
        push: server
    port: "8080"
    env:
      - name: ANON_KEY
        from:
          env: SUPABASE_STORAGE__ANON_KEY
      - name: SERVICE_KEY
        from:
          env: SUPABASE_STORAGE__SERVICE_KEY
      - name: POSTGREST_URL
        value: http://supabase-rest:3000
      - name: AUTH_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: JWT_JWKS
        value: "}"
      - name: DATABASE_URL
        from:
          env: SUPABASE_STORAGE__DATABASE_URL
      - name: STORAGE_PUBLIC_URL
        value: https://app.example.com
      - name: REQUEST_ALLOW_X_FORWARDED_PATH
        value: "true"
      - name: FILE_SIZE_LIMIT
        value: "52428800"
      - name: STORAGE_BACKEND
        value: file
      - name: GLOBAL_S3_BUCKET
        value: stub
      - name: FILE_STORAGE_BACKEND_PATH
        value: /var/lib/storage
      - name: TENANT_ID
        value: stub
      - name: REGION
        value: stub
      - name: ENABLE_IMAGE_TRANSFORMATION
        value: "true"
      - name: IMGPROXY_URL
        value: http://supabase-imgproxy:5001
      - name: S3_PROTOCOL_ACCESS_KEY_ID
        from:
          env: S3_PROTOCOL_ACCESS_KEY_ID
      - name: S3_PROTOCOL_ACCESS_KEY_SECRET
        from:
          env: S3_PROTOCOL_ACCESS_KEY_SECRET
    volumes:
      - supabase-volumes-storage:/var/lib/storage
  supabase-imgproxy:
    preset: service
    image:
      repository: supabase-imgproxy
      tag: latest
      build_config:
        context: ./supabase-imgproxy
        push: server
    port: "8080"
    env:
      - name: IMGPROXY_BIND
        value: :5001
      - name: IMGPROXY_LOCAL_FILESYSTEM_ROOT
        value: /
      - name: IMGPROXY_USE_ETAG
        value: "true"
      - name: IMGPROXY_AUTO_WEBP
        value: "true"
      - name: IMGPROXY_MAX_SRC_RESOLUTION
        value: "16.8"
    volumes:
      - supabase-volumes-storage:/var/lib/storage
  supabase-meta:
    preset: service
    image:
      repository: supabase-meta
      tag: latest
      build_config:
        context: ./supabase-meta
        push: server
    port: "8080"
    env:
      - name: PG_META_PORT
        value: "8080"
      - name: PG_META_DB_HOST
        value: supabase-db
      - name: PG_META_DB_PORT
        value: "5432"
      - name: PG_META_DB_NAME
        value: postgres
      - name: PG_META_DB_USER
        value: postgres
      - name: PG_META_DB_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: CRYPTO_KEY
        from:
          env: PG_META_CRYPTO_KEY
  supabase-functions:
    preset: service
    image:
      repository: supabase-functions
      tag: latest
      build_config:
        context: ./supabase-functions
        push: server
    port: "8080"
    env:
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: SUPABASE_JWKS
        value: "}"
      - name: SUPABASE_URL
        value: http://supabase-api-gw:8000
      - name: SB_JWT_ISSUER
        value: https://app.example.com/auth/v1
      - name: SUPABASE_PUBLIC_URL
        value: https://app.example.com
      - name: SUPABASE_ANON_KEY
        from:
          env: SUPABASE_FUNCTIONS__SUPABASE_ANON_KEY
      - name: SUPABASE_SERVICE_ROLE_KEY
        from:
          env: SUPABASE_FUNCTIONS__SUPABASE_SERVICE_ROLE_KEY
      - name: SUPABASE_PUBLISHABLE_KEYS
        from:
          env: SUPABASE_FUNCTIONS__SUPABASE_PUBLISHABLE_KEYS
      - name: SUPABASE_SECRET_KEYS
        from:
          env: SUPABASE_FUNCTIONS__SUPABASE_SECRET_KEYS
      - name: SUPABASE_DB_URL
        from:
          env: SUPABASE_FUNCTIONS__SUPABASE_DB_URL
      - name: VERIFY_JWT
        value: "false"
    volumes:
      - supabase-volumes-functions:/home/deno/functions
      - supabase-deno-cache:/root/.cache/deno
  supabase-db:
    preset: database
    image:
      repository: supabase-db
      tag: latest
      build_config:
        context: ./supabase-db
        push: server
    port: "5432"
    env:
      - name: POSTGRES_HOST
        value: /var/run/postgresql
      - name: PGPORT
        value: "5432"
      - name: POSTGRES_PORT
        value: "5432"
      - name: PGPASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: PGDATABASE
        value: postgres
      - name: POSTGRES_DB
        value: postgres
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: JWT_EXP
        value: "3600"
    volumes:
      - supabase-volumes-db-data:/var/lib/postgresql/data
      - supabase-db-config:/etc/postgresql-custom
  supabase-supavisor:
    health_check_path: /api/health
    preset: service
    image:
      repository: supabase-supavisor
      tag: latest
      build_config:
        context: ./supabase-supavisor
        push: server
    port: "5432"
    env:
      - name: PORT
        value: "4000"
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_HOST
        value: supabase-db
      - name: POSTGRES_DB
        value: postgres
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: DATABASE_URL
        from:
          env: SUPABASE_SUPAVISOR__DATABASE_URL
      - name: CLUSTER_POSTGRES
        value: "true"
      - name: SECRET_KEY_BASE
        from:
          env: SECRET_KEY_BASE
      - name: VAULT_ENC_KEY
        from:
          env: VAULT_ENC_KEY
      - name: API_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: METRICS_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: REGION
        value: local
      - name: ERL_AFLAGS
        value: -proto_dist inet_tcp
      - name: POOLER_TENANT_ID
        from:
          env: POOLER_TENANT_ID
      - name: POOLER_DEFAULT_POOL_SIZE
        value: "20"
      - name: POOLER_MAX_CLIENT_CONN
        value: "100"
      - name: POOLER_POOL_MODE
        value: transaction
      - name: DB_POOL_SIZE
        value: "5"
