name: typebot
server: localhost
targets:
  typebot-db:
    preset: database
    image: postgres:14-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: typebot
      - name: POSTGRES_DB
        value: typebot
      - name: POSTGRES_PASSWORD
        value: typebot
    volumes:
      - typebot-db-data:/var/lib/postgresql/data
  typebot-builder:
    image: baptistearno/typebot-builder:2.27
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: ENCRYPTION_SECRET
        from:
          env: ENCRYPTION_SECRET
      - name: DATABASE_URL
        value: postgresql://typebot:typebot@typebot-db:5432/typebot
      - name: NEXTAUTH_URL
        value: https://app.example.com
      - name: NEXT_PUBLIC_VIEWER_URL
        value: https://app.example.com
      - name: ADMIN_EMAIL
        value: typebot@example.com
      - name: SMTP_HOST
        value: "'Fill'"
      - name: SMTP_PORT
        value: "25"
      - name: NEXT_PUBLIC_SMTP_FROM
        value: typebot@example.com
      - name: SMTP_USERNAME
        value: "'Fill'"
      - name: SMTP_PASSWORD
        value: "'Fill'"
      - name: DEFAULT_WORKSPACE_PLAN
        value: UNLIMITED
  typebot-viewer:
    image: baptistearno/typebot-viewer:2.27.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: ENCRYPTION_SECRET
        from:
          env: ENCRYPTION_SECRET
      - name: DATABASE_URL
        value: postgresql://typebot:typebot@typebot-db:5432/typebot
      - name: NEXTAUTH_URL
        value: https://app.example.com
      - name: NEXT_PUBLIC_VIEWER_URL
        value: https://app.example.com
      - name: ADMIN_EMAIL
        value: typebot@example.com
      - name: SMTP_HOST
        value: "'Fill'"
      - name: SMTP_PORT
        value: "25"
      - name: NEXT_PUBLIC_SMTP_FROM
        value: typebot@example.com
      - name: SMTP_USERNAME
        value: "'Fill'"
      - name: SMTP_PASSWORD
        value: "'Fill'"
      - name: DEFAULT_WORKSPACE_PLAN
        value: UNLIMITED
