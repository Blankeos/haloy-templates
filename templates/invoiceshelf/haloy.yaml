name: invoiceshelf
server: localhost
targets:
  invoiceshelf-postgres:
    preset: database
    image: postgres:15
    port: "5432"
    env:
      - name: POSTGRES_PASSWORD
        from:
          env: DB_PASSWORD
      - name: POSTGRES_USER
        value: invoiceshelf
      - name: POSTGRES_DB
        value: invoiceshelf
    volumes:
      - invoiceshelf-invoiceshelf-postgres-data:/var/lib/postgresql/data
  invoiceshelf-app:
    image: invoiceshelf/invoiceshelf:nightly
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: PHP_TZ
        value: UTC
      - name: TIMEZONE
        value: UTC
      - name: APP_NAME
        value: InvoiceShelf
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: "false"
      - name: APP_URL
        value: https://app.example.com
      - name: DB_CONNECTION
        value: pgsql
      - name: DB_HOST
        value: invoiceshelf-postgres
      - name: DB_PORT
        value: "5432"
      - name: DB_DATABASE
        value: invoiceshelf
      - name: DB_USERNAME
        value: invoiceshelf
      - name: DB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: CACHE_STORE
        value: file
      - name: SESSION_DRIVER
        value: file
      - name: SESSION_LIFETIME
        value: "120"
      - name: SESSION_ENCRYPT
        value: "true"
      - name: SESSION_PATH
        value: /
      - name: SESSION_DOMAIN
        value: app.example.com
      - name: SANCTUM_STATEFUL_DOMAINS
        value: app.example.com
      - name: STARTUP_DELAY
        value: "10"
    volumes:
      - invoiceshelf-invoiceshelf-storage:/var/www/html/storage
