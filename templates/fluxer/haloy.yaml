name: fluxer
server: localhost
targets:
  fluxer-caddy:
    image: caddy:2.10-alpine
    port: "80"
    domains:
      - domain: app.example.com
    volumes:
      - fluxer-caddy-data:/data
      - fluxer-caddy-config:/config
  fluxer-postgres:
    preset: database
    image: postgres:16-alpine
    port: "5432"
    env:
      - name: POSTGRES_DB
        value: fluxer
      - name: POSTGRES_USER
        value: fluxer
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
    volumes:
      - fluxer-postgres-data:/var/lib/postgresql/data
  fluxer-valkey:
    preset: database
    image:
      repository: fluxer-valkey
      tag: latest
      build_config:
        context: ./fluxer-valkey
        push: server
    port: "6379"
  fluxer-nats:
    preset: database
    image:
      repository: fluxer-nats
      tag: latest
      build_config:
        context: ./fluxer-nats
        push: server
    port: "4222"
    volumes:
      - fluxer-nats-data:/data
  fluxer-meilisearch:
    preset: service
    image:
      repository: fluxer-meilisearch
      tag: latest
      build_config:
        context: ./fluxer-meilisearch
        push: server
    port: "8080"
    env:
      - name: MEILI_ENV
        value: production
      - name: MEILI_NO_ANALYTICS
        value: "true"
      - name: MEILI_MASTER_KEY
        from:
          env: MEILI_MASTER_KEY
    volumes:
      - fluxer-meilisearch-data:/meili_data
  fluxer-seaweedfs:
    preset: service
    image:
      repository: fluxer-seaweedfs
      tag: latest
      build_config:
        context: ./fluxer-seaweedfs
        push: server
    port: "8080"
    volumes:
      - fluxer-seaweedfs-data:/data
  fluxer-gifs:
    preset: service
    image:
      repository: fluxer-gifs
      tag: latest
      build_config:
        context: ./fluxer-gifs
        push: server
    port: "8080"
    env:
      - name: FLUXER_ENV
        value: production
      - name: NODE_ENV
        value: production
      - name: FLUXER_SELF_HOSTED
        value: "true"
      - name: FLUXER_BASE_DOMAIN
        value: app.example.com
      - name: FLUXER_PUBLIC_SCHEME
        value: http
      - name: FLUXER_PUBLIC_PORT
        value: "80"
      - name: FLUXER_TRUST_CLIENT_IP_HEADER
        value: "true"
      - name: FLUXER_CLIENT_IP_HEADER_NAME
        value: x-forwarded-for
      - name: FLUXER_DATABASE_BACKEND
        value: postgres
      - name: FLUXER_POSTGRES_HOST
        value: fluxer-postgres
      - name: FLUXER_POSTGRES_PORT
        value: "5432"
      - name: FLUXER_POSTGRES_DATABASE
        value: fluxer
      - name: FLUXER_POSTGRES_USERNAME
        value: fluxer
      - name: FLUXER_POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: FLUXER_POSTGRES_SSL
        value: "false"
      - name: FLUXER_KV_URL
        value: redis://fluxer-valkey:6379/0
      - name: FLUXER_NATS_URL
        value: nats://fluxer-nats:4222
      - name: FLUXER_NATS_JETSTREAM_URL
        value: nats://fluxer-nats:4222
      - name: FLUXER_SVC_NATS_URL
        value: nats://fluxer-nats:4222
      - name: FLUXER_SVC_SHARD_COUNT
        value: "1"
      - name: FLUXER_SEARCH_ENGINE
        value: meilisearch
      - name: FLUXER_SEARCH_URL
        value: http://fluxer-meilisearch:7700
      - name: FLUXER_SEARCH_API_KEY
        from:
          env: MEILI_MASTER_KEY
      - name: FLUXER_S3_ENDPOINT
        value: http://fluxer-seaweedfs:8333
      - name: FLUXER_S3_PUBLIC_ENDPOINT
        value: http://fluxer-seaweedfs:8333
      - name: FLUXER_S3_REGION
        value: us-east-1
      - name: FLUXER_S3_ACCESS_KEY_ID
        value: fluxer
      - name: FLUXER_S3_SECRET_ACCESS_KEY
        from:
          env: FLUXER_S3_SECRET_KEY
      - name: FLUXER_S3_FORCE_PATH_STYLE
        value: "true"
      - name: FLUXER_S3_BUCKET_CDN
        value: fluxer
      - name: FLUXER_S3_BUCKET_UPLOADS
        value: fluxer-uploads
      - name: FLUXER_S3_BUCKET_DOWNLOADS
        value: fluxer-downloads
      - name: FLUXER_S3_BUCKET_REPORTS
        value: fluxer-reports
      - name: FLUXER_S3_BUCKET_HARVESTS
