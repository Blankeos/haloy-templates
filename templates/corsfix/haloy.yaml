name: corsfix
server: localhost
targets:
  corsfix:
    image: ghcr.io/corsfix/corsfix-app:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: MONGODB_URI
        from:
          env: CORSFIX__MONGODB_URI
      - name: REDIS_URI
        from:
          env: CORSFIX__REDIS_URI
      - name: KEK_VERSION
        value: KEK_VERSION_1
      - name: KEK_VERSION_1
        from:
          env: KEK_VERSION_1
      - name: AUTH_SECRET
        from:
          env: AUTH_SECRET
      - name: AUTH_TRUST_HOST
        value: "true"
      - name: AUTH_URL
        value: https://app.example.com
      - name: PROXY_DOMAIN
        value: app.example.com
      - name: DISABLE_SIGNUP
        value: "false"
  corsfix-proxy:
    image: ghcr.io/corsfix/corsfix-proxy:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: MONGODB_URI
        from:
          env: CORSFIX_PROXY__MONGODB_URI
      - name: REDIS_URI
        from:
          env: CORSFIX_PROXY__REDIS_URI
      - name: KEK_VERSION_1
        from:
          env: KEK_VERSION_1
      - name: APP_DOMAIN
        value: app.example.com
      - name: RPM
        value: "180"
  corsfix-mongodb:
    preset: database
    image: mongo:8.0.17
    port: "27017"
    env:
      - name: MONGO_INITDB_ROOT_USERNAME
        value: corsfix
      - name: MONGO_INITDB_ROOT_PASSWORD
        from:
          env: MONGODB_PASSWORD
      - name: MONGO_INITDB_DATABASE
        value: db
    volumes:
      - corsfix-mongodb-data:/data/db
      - corsfix-mongodb-config:/data/configdb
  corsfix-redis:
    preset: database
    image:
      repository: corsfix-redis
      tag: latest
      build_config:
        context: ./corsfix-redis
        push: server
    port: "6379"
    env:
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
    volumes:
      - corsfix-redis-data:/data
