name: audiobookshelf
server: localhost
targets:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.19.4
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: TZ
        value: UTC
    volumes:
      - audiobookshelf-config:/config
      - audiobookshelf-metadata:/metadata
      - /path/to/your/audiobooks:/audiobooks
