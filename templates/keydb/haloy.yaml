name: keydb
server: localhost
targets:
  keydb:
    preset: database
    image:
      repository: keydb
      tag: latest
      build_config:
        context: ./keydb
        push: server
    port: "6379"
    env:
      - name: KEYDB_PASSWORD
        from:
          env: KEYDB_PASSWORD
    volumes:
      - keydb-keydb-data:/data
