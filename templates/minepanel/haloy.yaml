name: minepanel
server: localhost
targets:
  minepanel-backend:
    image: ketbom/minepanel-backend:1.7.1
    port: "8091"
    domains:
      - domain: api-app.example.com
    env:
      - name: NODE_ENV
        value: production
      - name: FRONTEND_URL
        value: https://app.example.com
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: CLIENT_PASSWORD
        from:
          env: CLIENT_PASSWORD
      - name: CLIENT_USERNAME
        value: admin
      - name: BASE_DIR
        value: /app
    volumes:
      - minepanel-minepanel-servers:/app/servers
      - minepanel-minepanel-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
  minepanel-frontend:
    image: ketbom/minepanel-frontend:1.7.1
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NEXT_PUBLIC_BACKEND_URL
        value: https://api-app.example.com
      - name: NEXT_PUBLIC_DEFAULT_LANGUAGE
        value: en
