name: scrypted
server: localhost
targets:
  scrypted:
    image: ghcr.io/koush/scrypted:latest
    port: "11080"
    domains:
      - domain: app.example.com
    env:
      - name: SCRYPTED_WEBHOOK_UPDATE_AUTHORIZATION
        from:
          env: SCRYPTED_WEBHOOK_UPDATE_AUTHORIZATION
      - name: SCRYPTED_WEBHOOK_UPDATE
        value: http://app.example.com:10444/v1/update
    volumes:
      - scrypted-scrypted-volume:/server/volume
