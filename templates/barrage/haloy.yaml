name: barrage
server: localhost
targets:
  barrage:
    image: maulik9898/barrage:0.3.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NEXTAUTH_SECRET
        from:
          env: INLINE_BASE64
      - name: NEXTAUTH_URL
        value: http://app.example.com
      - name: DELUGE_URL
        value: http://your-deluge-ip:8112
      - name: DELUGE_PASSWORD
        from:
          env: INLINE_PASSWORD_16
      - name: BARRAGE_PASSWORD
        from:
          env: INLINE_PASSWORD_16
