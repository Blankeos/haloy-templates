    preset: database
    image: postgres:17-alpine
    port: "5432"
    env:
      - name: POSTGRES_DB
        value: puppetflow
      - name: POSTGRES_USER
        value: admin
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
    volumes:
      - puppetflow-postgres-puppetflow-db:/var/lib/postgresql/data
