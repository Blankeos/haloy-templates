name: puppetflow-postgres
server: localhost
targets:
  puppetflow-postgres-puppetflow:
    health_check_path: /up
    image: ghcr.io/puppetflow/puppetflow:v2026.11.7
    port: "8000"
    domains:
      - domain: app.example.com
    env:
      - name: APP_ENV
        value: production
      - name: LOG_STACK
        value: single,stderr
      - name: LANG
        value: C.UTF-8
      - name: LANGUAGE
        value: en-US
      - name: CONNECTION_TIMEOUT_MS
        value: "60000000"
      - name: APP_URL
        value: http://app.example.com
      - name: APP_KEY
        from:
          env: APP_KEY
      - name: APP_QUEUES_COUNTER
        value: "2"
      - name: DB_CONNECTION
        value: pgsql
      - name: DB_HOST
        value: puppetflow-postgres-postgres
      - name: DB_PORT
        value: "5432"
      - name: DB_DATABASE
        value: puppetflow
      - name: DB_USERNAME
        value: admin
      - name: DB_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: REDIS_HOST
        value: puppetflow-postgres-redis
      - name: REDIS_PORT
        value: "6379"
      - name: PINOKIO_HOST
        value: puppetflow-postgres-pinokio
      - name: PINOKIO_PORT
        value: "3000"
      - name: PINOKIO_TOKEN
        from:
          env: PINOKIO_TOKEN
      - name: RUNNER_API_INTERNAL_URL
        value: http://puppetflow-postgres-puppetflow:8000/api/internal/runner
      - name: BROWSER_STREAM_INTERNAL_URL
        value: http://puppetflow-postgres-stream-server:6080
      - name: BROWSER_STREAM_PUBLIC_URL
        value: http://app.example.com
      - name: BROWSER_STREAM_ALLOWED_ORIGINS
        value: http://app.example.com
      - name: BROWSER_STREAM_SECRET
        from:
          env: BROWSER_STREAM_SECRET
    volumes:
      - puppetflow-postgres-puppetflow-framework:/app/storage
      - puppetflow-postgres-puppetflow-execution:/app/data/execution
      - puppetflow-postgres-puppetflow-uploads:/app/data/storage
  puppetflow-postgres-migrate:
