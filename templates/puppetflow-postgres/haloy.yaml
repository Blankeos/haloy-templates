    preset: service
    image: ghcr.io/puppetflow/pinokio:v2026.11.1
    port: "8080"
    env:
      - name: TOKEN
        from:
          env: PINOKIO_TOKEN
      - name: HOME
        value: /tmp
      - name: XDG_CONFIG_HOME
        value: /tmp/.config
      - name: XDG_CACHE_HOME
        value: /tmp/.cache
      - name: LANG
        value: C.UTF-8
      - name: LANGUAGE
        value: en-US
