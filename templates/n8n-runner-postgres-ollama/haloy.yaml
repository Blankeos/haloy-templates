name: n8n-runner-postgres-ollama
server: localhost
targets:
  n8n-runner-postgres-ollama-n8n:
    image: n8nio/n8n:latest
    port: "5678"
    domains:
      - domain: app.example.com
    env:
      - name: NODE_ENV
        value: production
      - name: N8N_HOST
        value: app.example.com
      - name: N8N_PORT
        value: "5678"
      - name: N8N_PROTOCOL
        value: https
      - name: DB_TYPE
        value: postgresdb
      - name: DB_POSTGRESDB_HOST
        value: n8n-runner-postgres-ollama-postgres
      - name: DB_POSTGRESDB_USER
        value: admin
      - name: DB_POSTGRESDB_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - name: N8N_PERSONALIZATION_ENABLED
        value: "true"
      - name: N8N_ENCRYPTION_KEY
        from:
          env: N8N_ENCRYPTION_KEY
      - name: N8N_SECURE_COOKIE
        value: "true"
      - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "true"
      - name: N8N_PROXY_HOPS
        value: "0"
      - name: WEBHOOK_URL
        value: https://app.example.com/
      - name: GENERIC_TIMEZONE
        value: Europe/Berlin
      - name: N8N_TEMPLATES_ENABLED
        value: "true"
      - name: N8N_HIRING_BANNER_ENABLED
        value: "false"
      - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
        value: "true"
      - name: OLLAMA_HOST
        value: http://n8n-runner-postgres-ollama-ollama:11434
      - name: N8N_RUNNERS_ENABLED
        value: "true"
      - name: N8N_RUNNERS_MODE
        value: external
      - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
        value: 0.0.0.0
      - name: N8N_RUNNERS_AUTH_TOKEN
        from:
          env: N8N_RUNNER_SECRET
      - name: N8N_NATIVE_PYTHON_RUNNER
        value: "true"
      - name: N8N_RUNNERS_MAX_CONCURRENCY
        value: "50"
      - name: EXECUTIONS_DATA_PRUNE
        value: "true"
      - name: EXECUTIONS_DATA_MAX_AGE
        value: "7"
      - name: EXECUTIONS_MODE
        value: queue
      - name: QUEUE_BULL_REDIS_HOST
        value: n8n-runner-postgres-ollama-redis
      - name: QUEUE_BULL_REDIS_PORT
        value: "6379"
    volumes:
      - n8n-runner-postgres-ollama-n8n-data:/home/node/.n8n
  n8n-runner-postgres-ollama-n8n-worker:
    preset: service
    image:
      repository: n8n-runner-postgres-ollama-n8n-worker
      tag: latest
      build_config:
        context: ./n8n-runner-postgres-ollama-n8n-worker
        push: server
    port: "8080"
    env:
      - name: NODE_ENV
        value: production
      - name: N8N_HOST
        value: app.example.com
      - name: N8N_PORT
        value: "5678"
      - name: N8N_PROTOCOL
        value: https
      - name: EXECUTIONS_MODE
        value: queue
      - name: DB_TYPE
        value: postgresdb
      - name: DB_POSTGRESDB_HOST
        value: n8n-runner-postgres-ollama-postgres
      - name: DB_POSTGRESDB_USER
        value: admin
      - name: DB_POSTGRESDB_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: N8N_ENCRYPTION_KEY
        from:
          env: N8N_ENCRYPTION_KEY
      - name: N8N_SECURE_COOKIE
        value: "true"
      - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "true"
      - name: N8N_PROXY_HOPS
        value: "0"
      - name: WEBHOOK_URL
        value: https://app.example.com/
      - name: GENERIC_TIMEZONE
        value: Europe/Berlin
      - name: QUEUE_BULL_REDIS_HOST
        value: n8n-runner-postgres-ollama-redis
      - name: QUEUE_BULL_REDIS_PORT
        value: "6379"
  n8n-runner-postgres-ollama-n8n-runner:
    preset: service
    image:
      repository: n8n-runner-postgres-ollama-n8n-runner
      tag: latest
      build_config:
        context: ./n8n-runner-postgres-ollama-n8n-runner
        push: server
    port: "8080"
    env:
      - name: N8N_RUNNERS_TASK_BROKER_URI
        value: http://n8n-runner-postgres-ollama-n8n:5679
      - name: N8N_RUNNERS_AUTH_TOKEN
        from:
          env: N8N_RUNNER_SECRET
      - name: N8N_ENCRYPTION_KEY
        from:
          env: N8N_ENCRYPTION_KEY
      - name: GENERIC_TIMEZONE
        value: Europe/Berlin
      - name: N8N_RUNNERS_MAX_CONCURRENCY
        value: "50"
  n8n-runner-postgres-ollama-ollama:
    preset: service
    image:
      repository: n8n-runner-postgres-ollama-ollama
      tag: latest
      build_config:
        context: ./n8n-runner-postgres-ollama-ollama
        push: server
    port: "8080"
    volumes:
      - n8n-runner-postgres-ollama-ollama-storage:/home/node/.ollama
  n8n-runner-postgres-ollama-init-ollama:
    preset: service
    image:
      repository: n8n-runner-postgres-ollama-init-ollama
      tag: latest
      build_config:
        context: ./n8n-runner-postgres-ollama-init-ollama
        push: server
    port: "8080"
    env:
      - name: OLLAMA_HOST
        value: n8n-runner-postgres-ollama-ollama:11434
    volumes:
      - n8n-runner-postgres-ollama-ollama-storage:/home/node/.ollama
  n8n-runner-postgres-ollama-redis:
    preset: database
    image:
      repository: n8n-runner-postgres-ollama-redis
      tag: latest
      build_config:
        context: ./n8n-runner-postgres-ollama-redis
        push: server
    port: "6379"
    volumes:
      - n8n-runner-postgres-ollama-redis-storage:/data
  n8n-runner-postgres-ollama-postgres:
    preset: database
    image: postgres:17-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: admin
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: n8n
    volumes:
      - n8n-runner-postgres-ollama-postgres-storage:/var/lib/postgresql/data
