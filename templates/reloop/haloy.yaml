name: reloop
server: localhost
targets:
  reloop-proxy:
    image:
      repository: reloop-proxy
      tag: latest
      build_config:
        context: ./reloop-proxy
        push: server
    port: "80"
    domains:
      - domain: app.example.com
  reloop-links:
    image: reloopsh/fe-links@sha256:8a22fde21a656c25163e2b856a856053c5de91cbc4953cc23ed034c081eedfa5
    port: "3005"
    domains:
      - domain: app.example.com
    env:
      - name: HOSTNAME
        value: 0.0.0.0
      - name: PORT
        value: "3005"
      - name: INTERNAL_API_URL
        value: http://reloop-contacts:8014/api/contacts
      - name: INTERNAL_MAIL_API_URL
        value: http://reloop-mail:8015/api/mail
  reloop-dashboard:
    preset: service
    image:
      repository: reloop-dashboard
      tag: latest
      build_config:
        context: ./reloop-dashboard
        push: server
    port: "8080"
    env:
      - name: HOSTNAME
        value: 0.0.0.0
      - name: PORT
        value: "3000"
      - name: SMTP_HOSTNAME
        value: app.example.com
  reloop-postgres:
    preset: database
    image: postgres:17-alpine
    port: "5432"
    env:
      - name: POSTGRES_DB
        value: reloop
      - name: POSTGRES_USER
        value: reloop
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
    volumes:
      - reloop-postgres-data:/var/lib/postgresql/data
  reloop-redis:
    preset: database
    image:
      repository: reloop-redis
      tag: latest
      build_config:
        context: ./reloop-redis
        push: server
    port: "6379"
    env:
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
    volumes:
      - reloop-redis-data:/data
  reloop-nats:
    health_check_path: /healthz
    preset: database
    image:
      repository: reloop-nats
      tag: latest
      build_config:
        context: ./reloop-nats
        push: server
    port: "4222"
    volumes:
      - reloop-nats-data:/data
  reloop-migrate:
    preset: service
    image:
      repository: reloop-migrate
      tag: latest
      build_config:
        context: ./reloop-migrate
        push: server
    port: "8080"
    env:
      - name: PG_URL
        from:
          env: RELOOP_MIGRATE__PG_URL
  reloop-auth:
    preset: service
    image:
      repository: reloop-auth
      tag: latest
      build_config:
        context: ./reloop-auth
        push: server
    port: "8080"
    env:
      - name: RELOOP_VERSION
        value: latest
      - name: NODE_ENV
        value: production
      - name: BASE_URL
        value: https://app.example.com
      - name: HOST_DOMAIN
        value: app.example.com
      - name: TRACKING_DOMAIN
        value: app.example.com
      - name: TRACKING_BASE_URL
        value: https://app.example.com
      - name: INBOUND_HOSTNAME
        value: inbound.app.example.com
      - name: SMTP_HOSTNAME
        value: app.example.com
      - name: AUTH_INTERNAL_BASE_URL
        value: http://reloop-auth:8000
      - name: PG_URL
        from:
          env: RELOOP_AUTH__PG_URL
      - name: REDIS_URL
        from:
          env: RELOOP_AUTH__REDIS_URL
      - name: NATS_URL
        value: nats://reloop-nats:4222
      - name: BETTER_AUTH_SECRET
        from:
          env: INLINE_PASSWORD_64
      - name: RELOOP_INTERNAL_SECRET
        from:
          env: INLINE_PASSWORD_64
      - name: TRACKING_SECRET
        from:
          env: INLINE_PASSWORD_64
      - name: PREFERENCES_SECRET
        from:
          env: INLINE_PASSWORD_64
      - name: WEBHOOK_ENCRYPTION_KEY
        from:
          env: INLINE_HASH_64
      - name: WORKBENCH_USER
        value: admin
      - name: WORKBENCH_PASS
        from:
          env: INLINE_PASSWORD_32
      - name: APP_NAME
        value: Reloop
      - name: DISABLE_SIGNUP
        value: "true"
      - name: DISABLE_ORG_CREATION
        value: "false"
      - name: DKIM_SELECTOR
        value: reloop
      - name: DNS_RESOLVERS
        value: 8.8.8.8,8.8.4.4
      - name: SMTP_PORT
        value: "587"
      - name: SMTP_SECURE
        value: "false"
      - name: S3_BUCKET
        value: reloop-uploads
      - name: S3_REGION
        value: us-east-1
      - name: S3_FORCE_PATH_STYLE
        value: "true"
      - name: KUMOMTA_HTTP_URL
        value: http://reloop-smtp:8000
      - name: KUMOMTA_WEBHOOK_URL
