      - name: PORT
        value: "8000"
      - name: SETUP_MODE
        value: "true"
      - name: ADMIN_SETUP_KEY
        from:
          env: INLINE_PASSWORD_64
    volumes:
      - reloop-reloop-setup:/run/reloop
