name: hoarder
server: localhost
targets:
  hoarder-web:
    image: ghcr.io/hoarder-app/hoarder:0.22.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NEXTAUTH_URL
        value: https://app.example.com
      - name: NEXTAUTH_SECRET
        from:
          env: NEXT_SECRET
      - name: MEILI_ADDR
        value: http://hoarder-meilisearch:7700
      - name: BROWSER_WEB_URL
        value: http://hoarder-chrome:9222
      - name: DATA_DIR
        value: /data
      - name: MEILI_MASTER_KEY
        from:
          env: MEILI_MASTER_KEY
    volumes:
      - hoarder-hoarder-data:/data
  hoarder-chrome:
    preset: service
    image:
      repository: hoarder-chrome
      tag: latest
      build_config:
        context: ./hoarder-chrome
        push: server
    port: "8080"
  hoarder-meilisearch:
    health_check_path: /health
    preset: service
    image:
      repository: hoarder-meilisearch
      tag: latest
      build_config:
        context: ./hoarder-meilisearch
        push: server
    port: "8080"
    env:
      - name: MEILI_MASTER_KEY
        from:
          env: MEILI_MASTER_KEY
      - name: MEILI_NO_ANALYTICS
        value: "true"
    volumes:
      - hoarder-meilisearch-data:/meili_data
