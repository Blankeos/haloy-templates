name: junctio
server: localhost
targets:
  junctio:
    image: ghcr.io/k2so-dev/junctio:0.2.6
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: JUNCTIO_SECRET
        from:
          env: JUNCTIO_SECRET
      - name: JUNCTIO_BASE_URL
        value: https://app.example.com
      - name: JUNCTIO_TRUST_PROXY
        value: "true"
    volumes:
      - junctio-junctio-data:/data
      - junctio-junctio-cache:/cache
