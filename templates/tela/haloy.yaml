name: tela
server: localhost
targets:
  tela-proxy:
    image: ghcr.io/zcag/tela-proxy:0.7.0
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: TELA_SITE_ADDRESS
        value: :80
      - name: TELA_UPSTREAM_BACKEND
        value: tela-backend:8080
      - name: TELA_UPSTREAM_FRONTEND
        value: tela-frontend:80
    volumes:
      - tela-caddy-data:/data
      - tela-caddy-config:/config
  tela-backend:
    preset: service
    image: ghcr.io/zcag/tela-backend:0.7.0
    port: "8080"
    env:
      - name: TELA_PUBLIC_BASE_URL
        value: https://app.example.com
      - name: TELA_DATABASE_URL
        from:
          env: TELA_BACKEND__TELA_DATABASE_URL
      - name: TELA_SHARE_SECRET
        from:
          env: SHARE_SECRET
      - name: TELA_API_KEY_SECRET
        from:
          env: API_KEY_SECRET
      - name: TELA_DECK_URL
        value: http://tela-deck:3344
      - name: TELA_GOTENBERG_URL
        value: http://tela-gotenberg:3000
      - name: TELA_PDF_RENDER_BASE_URL
        value: http://tela-proxy
  tela-frontend:
    preset: service
    image: ghcr.io/zcag/tela-frontend:0.7.0
    port: "8080"
  tela-postgres:
    preset: database
    image: pgvector/pgvector:pg17
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: tela
      - name: POSTGRES_PASSWORD
        from:
          env: PG_PASSWORD
      - name: POSTGRES_DB
        value: tela
    volumes:
      - tela-pgdata:/var/lib/postgresql/data
  tela-deck:
    preset: service
    image: ghcr.io/zcag/tela-deck:0.7.0
    port: "8080"
    volumes:
      - tela-deckcache:/data
  tela-gotenberg:
    preset: service
    image: gotenberg/gotenberg:8
    port: "8080"
