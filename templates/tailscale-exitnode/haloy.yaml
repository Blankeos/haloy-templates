name: tailscale-exitnode
server: localhost
targets:
  tailscale-exitnode:
    preset: service
    image:
      repository: tailscale-exitnode
      tag: latest
      build_config:
        context: ./tailscale-exitnode
        push: server
    port: "8080"
    env:
      - name: TS_EXTRA_ARGS
        value: --advertise-exit-node
      - name: TS_STATE_DIR
        value: /var/lib/tailscale
      - name: TS_USERSPACE
        value: "true"
    volumes:
      - tailscale-exitnode-tailscale-exitnode-data:/var/lib/tailscale
