name: coralproject
server: localhost
targets:
  coralproject-coral:
    image: coralproject/talk:9.7.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: MONGODB_URI
        from:
          env: CORALPROJECT_CORAL__MONGODB_URI
      - name: REDIS_URI
        from:
          env: CORALPROJECT_CORAL__REDIS_URI
      - name: SIGNING_SECRET
        from:
          env: SIGNING_SECRET
      - name: NODE_ENV
        value: production
  coralproject-mongo:
    preset: database
    image: mongo:4
    port: "27017"
    env:
      - name: MONGO_INITDB_ROOT_PASSWORD
        from:
          env: MONGO_PASSWORD
      - name: MONGO_INITDB_ROOT_USERNAME
        value: mongo
    volumes:
      - coralproject-mongo-data:/data/db
  coralproject-redis:
    preset: database
    image:
      repository: coralproject-redis
      tag: latest
      build_config:
        context: ./coralproject-redis
        push: server
    port: "6379"
    env:
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
    volumes:
      - coralproject-redis-data:/data
