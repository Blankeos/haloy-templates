name: langfuse
server: localhost
targets:
  langfuse-postgres:
    preset: database
    image: docker.io/postgres:17
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: postgres
      - name: TZ
        value: UTC
      - name: PGTZ
        value: UTC
    volumes:
      - langfuse-langfuse-postgres-data:/var/lib/postgresql/data
  langfuse-clickhouse:
    health_check_path: /ping
    preset: database
    image: docker.io/clickhouse/clickhouse-server:25.12
    port: "8123"
    env:
      - name: CLICKHOUSE_DB
        value: default
      - name: CLICKHOUSE_USER
        value: clickhouse
      - name: CLICKHOUSE_PASSWORD
        from:
          env: CLICKHOUSE_PASSWORD
    volumes:
      - langfuse-langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-langfuse-clickhouse-logs:/var/log/clickhouse-server
  langfuse-minio:
    health_check_path: /minio/health/live
    image:
      repository: langfuse-minio
      tag: latest
      build_config:
        context: ./langfuse-minio
        push: server
    port: "9000"
    domains:
      - domain: app.example.com
    env:
      - name: MINIO_ROOT_USER
        value: minio
      - name: MINIO_ROOT_PASSWORD
        from:
          env: MINIO_ROOT_PASSWORD
    volumes:
      - langfuse-langfuse-minio-data:/data
  langfuse-redis:
    preset: database
    image:
      repository: langfuse-redis
      tag: latest
      build_config:
        context: ./langfuse-redis
        push: server
    port: "6379"
    env:
      - name: REDIS_AUTH
        from:
          env: REDIS_AUTH
    volumes:
      - langfuse-langfuse-redis-data:/data
  langfuse-worker:
    preset: service
    image:
      repository: langfuse-worker
      tag: latest
      build_config:
        context: ./langfuse-worker
        push: server
    port: "8080"
    env:
      - name: NEXTAUTH_URL
        value: https://app.example.com
      - name: DATABASE_URL
        from:
          env: LANGFUSE_WORKER__DATABASE_URL
      - name: SALT
        from:
          env: SALT
      - name: ENCRYPTION_KEY
        from:
          env: ENCRYPTION_KEY
      - name: TELEMETRY_ENABLED
        value: "true"
      - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
        value: "false"
      - name: CLICKHOUSE_MIGRATION_URL
        value: clickhouse://langfuse-clickhouse:9000
      - name: CLICKHOUSE_URL
        value: http://langfuse-clickhouse:8123
      - name: CLICKHOUSE_USER
        value: clickhouse
      - name: CLICKHOUSE_PASSWORD
        from:
          env: CLICKHOUSE_PASSWORD
      - name: CLICKHOUSE_CLUSTER_ENABLED
        value: "false"
      - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
        value: langfuse
      - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
        value: auto
      - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
        value: minio
      - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
        from:
          env: MINIO_ROOT_PASSWORD
      - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
        value: http://langfuse-minio:9000
      - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
        value: "true"
      - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
        value: events/
      - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
        value: langfuse
      - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
        value: auto
      - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
        value: minio
      - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
        from:
          env: MINIO_ROOT_PASSWORD
      - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
        value: http://langfuse-minio:9000
      - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
        value: "true"
      - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
        value: media/
      - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
        value: "false"
      - name: REDIS_HOST
        value: langfuse-redis
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_AUTH
        from:
          env: REDIS_AUTH
      - name: REDIS_TLS_ENABLED
        value: "false"
  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NEXTAUTH_URL
        value: https://app.example.com
      - name: DATABASE_URL
        from:
          env: LANGFUSE_WEB__DATABASE_URL
      - name: SALT
        from:
          env: SALT
      - name: ENCRYPTION_KEY
        from:
          env: ENCRYPTION_KEY
      - name: TELEMETRY_ENABLED
        value: "true"
      - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
        value: "false"
      - name: CLICKHOUSE_MIGRATION_URL
        value: clickhouse://langfuse-clickhouse:9000
      - name: CLICKHOUSE_URL
        value: http://langfuse-clickhouse:8123
      - name: CLICKHOUSE_USER
        value: clickhouse
      - name: CLICKHOUSE_PASSWORD
        from:
          env: CLICKHOUSE_PASSWORD
      - name: CLICKHOUSE_CLUSTER_ENABLED
        value: "false"
      - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
        value: langfuse
      - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
        value: auto
      - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
        value: minio
      - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
        from:
          env: MINIO_ROOT_PASSWORD
      - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
        value: http://langfuse-minio:9000
      - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
        value: "true"
      - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
        value: events/
      - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
        value: langfuse
      - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
        value: auto
      - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
        value: minio
      - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
        from:
          env: MINIO_ROOT_PASSWORD
      - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
        value: https://app.example.com
      - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
        value: "true"
      - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
        value: media/
      - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
        value: "false"
      - name: REDIS_HOST
        value: langfuse-redis
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_AUTH
        from:
          env: REDIS_AUTH
      - name: REDIS_TLS_ENABLED
        value: "false"
      - name: HOSTNAME
        value: 0.0.0.0
      - name: NEXTAUTH_SECRET
        from:
          env: NEXTAUTH_SECRET
