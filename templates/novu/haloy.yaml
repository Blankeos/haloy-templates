name: novu
server: localhost
targets:
  novu-redis:
    preset: database
    image:
      repository: novu-redis
      tag: latest
      build_config:
        context: ./novu-redis
        push: server
    port: "6379"
    volumes:
      - novu-novu-redis:/data
  novu-mongodb:
    preset: database
    image: mongo:8.0.17
    port: "27017"
    env:
      - name: MONGO_INITDB_ROOT_USERNAME
        value: root
      - name: MONGO_INITDB_ROOT_PASSWORD
        from:
          env: MONGO_PASSWORD
    volumes:
      - novu-novu-mongodb:/data/db
  novu-api:
    health_check_path: /
    image: ghcr.io/novuhq/novu/api:3.18.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NODE_ENV
        value: production
      - name: API_ROOT_URL
        value: https://app.example.com
      - name: PORT
        value: "3000"
      - name: FRONT_BASE_URL
        value: https://app.example.com
      - name: MONGO_URL
        from:
          env: NOVU_API__MONGO_URL
      - name: MONGO_MIN_POOL_SIZE
        value: "5"
      - name: MONGO_MAX_POOL_SIZE
        value: "10"
      - name: MONGO_AUTO_CREATE_INDEXES
        value: "true"
      - name: REDIS_HOST
        value: novu-redis
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_DB_INDEX
        value: "2"
      - name: REDIS_CACHE_SERVICE_HOST
        value: novu-redis
      - name: REDIS_CACHE_SERVICE_PORT
        value: "6379"
      - name: S3_BUCKET_NAME
        value: novu-local
      - name: S3_REGION
        value: us-east-1
      - name: AWS_ACCESS_KEY_ID
        value: test
      - name: AWS_SECRET_ACCESS_KEY
        value: test
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: STORE_ENCRYPTION_KEY
        from:
          env: STORE_ENCRYPTION_KEY
      - name: NOVU_SECRET_KEY
        from:
          env: NOVU_SECRET_KEY
      - name: SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME
        value: 15d
      - name: NEW_RELIC_ENABLED
        value: "false"
      - name: IS_API_IDEMPOTENCY_ENABLED
        value: "false"
      - name: IS_API_RATE_LIMITING_ENABLED
        value: "false"
      - name: IS_NEW_MESSAGES_API_RESPONSE_ENABLED
        value: "true"
      - name: IS_V2_ENABLED
        value: "true"
      - name: IS_SELF_HOSTED
        value: "true"
  novu-worker:
    health_check_path: /
    preset: service
    image: ghcr.io/novuhq/novu/worker:3.18.0
    port: "8080"
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "3004"
      - name: MONGO_URL
        from:
          env: NOVU_WORKER__MONGO_URL
      - name: MONGO_MIN_POOL_SIZE
        value: "5"
      - name: MONGO_MAX_POOL_SIZE
        value: "10"
      - name: REDIS_HOST
        value: novu-redis
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_DB_INDEX
        value: "2"
      - name: REDIS_CACHE_SERVICE_HOST
        value: novu-redis
      - name: REDIS_CACHE_SERVICE_PORT
        value: "6379"
      - name: S3_BUCKET_NAME
        value: novu-local
      - name: S3_REGION
        value: us-east-1
      - name: AWS_ACCESS_KEY_ID
        value: test
      - name: AWS_SECRET_ACCESS_KEY
        value: test
      - name: STORE_ENCRYPTION_KEY
        from:
          env: STORE_ENCRYPTION_KEY
      - name: SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME
        value: 15d
      - name: NEW_RELIC_ENABLED
        value: "false"
      - name: BROADCAST_QUEUE_CHUNK_SIZE
        value: "100"
      - name: MULTICAST_QUEUE_CHUNK_SIZE
        value: "100"
      - name: API_ROOT_URL
        value: http://novu-api:3000
      - name: IS_EMAIL_INLINE_CSS_DISABLED
        value: "false"
      - name: IS_USE_MERGED_DIGEST_ID_ENABLED
        value: "false"
  novu-ws:
    health_check_path: /
    image: ghcr.io/novuhq/novu/ws:3.18.0
    port: "3002"
    domains:
      - domain: app.example.com
    env:
      - name: PORT
        value: "3002"
      - name: NODE_ENV
        value: production
      - name: MONGO_URL
        from:
          env: NOVU_WS__MONGO_URL
      - name: MONGO_MIN_POOL_SIZE
        value: "5"
      - name: MONGO_MAX_POOL_SIZE
        value: "10"
      - name: REDIS_HOST
        value: novu-redis
      - name: REDIS_PORT
        value: "6379"
      - name: JWT_SECRET
        from:
          env: JWT_SECRET
      - name: NEW_RELIC_ENABLED
        value: "false"
  novu:
    image: ghcr.io/novuhq/novu/dashboard:3.18.0
    port: "4000"
    domains:
      - domain: app.example.com
    env:
      - name: VITE_API_HOSTNAME
        value: https://app.example.com
      - name: VITE_WEBSOCKET_HOSTNAME
        value: https://app.example.com
