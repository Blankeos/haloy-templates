name: seafile
server: localhost
targets:
  seafile-db:
    preset: database
    image: mariadb:10.11
    port: "3306"
    env:
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: MYSQL_ROOT_PASSWORD
      - name: MYSQL_LOG_CONSOLE
        value: "true"
      - name: MARIADB_AUTO_UPGRADE
        value: "1"
    volumes:
      - seafile-seafile-mysql-db:/var/lib/mysql
  seafile-redis:
    preset: database
    image:
      repository: seafile-redis
      tag: latest
      build_config:
        context: ./seafile-redis
        push: server
    port: "6379"
    env:
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
  seafile:
    health_check_path: /
    image: seafileltd/seafile-mc:14.0.9
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: SEAFILE_MYSQL_DB_HOST
        value: seafile-db
      - name: SEAFILE_MYSQL_DB_PORT
        value: "3306"
      - name: SEAFILE_MYSQL_DB_USER
        value: seafile
      - name: SEAFILE_MYSQL_DB_PASSWORD
        from:
          env: MYSQL_USER_PASSWORD
      - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
        from:
          env: MYSQL_ROOT_PASSWORD
      - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
        value: ccnet_db
      - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
        value: seafile_db
      - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
        value: seahub_db
      - name: TIME_ZONE
        value: Etc/UTC
      - name: INIT_SEAFILE_ADMIN_EMAIL
        value: admin@example.com
      - name: INIT_SEAFILE_ADMIN_PASSWORD
        from:
          env: ADMIN_PASSWORD
      - name: SEAFILE_SERVER_HOSTNAME
        value: app.example.com
      - name: SEAFILE_SERVER_PROTOCOL
        value: https
      - name: SITE_ROOT
        value: /
      - name: NON_ROOT
        value: "false"
      - name: JWT_PRIVATE_KEY
        from:
          env: JWT_PRIVATE_KEY
      - name: SEAFILE_LOG_TO_STDOUT
        value: "false"
      - name: ENABLE_GO_FILESERVER
        value: "true"
      - name: ENABLE_SEAFDAV
        value: "false"
      - name: SEAFDAV_WORKERS
        value: "5"
      - name: ENABLE_SEADOC
        value: "true"
      - name: SEADOC_SERVER_URL
        value: https://app.example.com/sdoc-server
      - name: CACHE_PROVIDER
        value: redis
      - name: REDIS_HOST
        value: seafile-redis
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
      - name: MD_FILE_COUNT_LIMIT
        value: "100000"
    volumes:
      - seafile-seafile-data:/shared
  seafile-seadoc:
    preset: service
    image: seafileltd/sdoc-server:2.0.11
    port: "8080"
    env:
      - name: DB_HOST
        value: seafile-db
      - name: DB_PORT
        value: "3306"
      - name: DB_USER
        value: seafile
      - name: DB_PASSWORD
        from:
          env: MYSQL_USER_PASSWORD
      - name: DB_NAME
        value: ${SEAFILE_MYSQL_DB_SEAHUB_DB_NAME:-seahub_db}
      - name: TIME_ZONE
        value: Etc/UTC
      - name: JWT_PRIVATE_KEY
        from:
          env: JWT_PRIVATE_KEY
      - name: NON_ROOT
        value: "false"
      - name: SEAHUB_SERVICE_URL
        value: http://seafile
    volumes:
      - seafile-seadoc-data:/shared
