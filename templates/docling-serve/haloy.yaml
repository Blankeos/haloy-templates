name: docling-serve
server: localhost
targets:
  docling-serve:
    health_check_path: /health
    image: quay.io/docling-project/docling-serve:latest
    port: "5001"
    domains:
      - domain: app.example.com
    env:
      - name: DOCLING_SERVE_ENABLE_UI
        value: "1"
      - name: DOCLING_SERVE_HOST
        value: 0.0.0.0
      - name: DOCLING_SERVE_PORT
        value: "5001"
    volumes:
      - docling-serve-docling-data:/app/data
