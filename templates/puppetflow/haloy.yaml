name: puppetflow
server: localhost
targets:
  puppetflow:
    health_check_path: /up
    image: ghcr.io/puppetflow/puppetflow:v2026.11.7
    port: "8000"
    domains:
      - domain: app.example.com
    env:
      - name: APP_ENV
        value: production
      - name: LOG_STACK
        value: single,stderr
      - name: LANG
        value: C.UTF-8
      - name: LANGUAGE
        value: en-US
      - name: CONNECTION_TIMEOUT_MS
        value: "60000000"
      - name: APP_URL
        value: https://app.example.com
      - name: APP_KEY
        from:
          env: APP_KEY
      - name: APP_QUEUES_COUNTER
        value: "2"
      - name: DB_CONNECTION
        value: sqlite
      - name: DB_DATABASE
        value: /app/storage/database.sqlite
      - name: REDIS_HOST
        value: puppetflow-redis
      - name: REDIS_PORT
        value: "6379"
      - name: PINOKIO_HOST
        value: puppetflow-pinokio
      - name: PINOKIO_PORT
        value: "3000"
      - name: PINOKIO_TOKEN
        from:
          env: PINOKIO_TOKEN
      - name: RUNNER_API_INTERNAL_URL
        value: http://puppetflow:8000/api/internal/runner
      - name: BROWSER_STREAM_INTERNAL_URL
        value: http://puppetflow-stream-server:6080
      - name: BROWSER_STREAM_PUBLIC_URL
        value: https://app.example.com
      - name: BROWSER_STREAM_ALLOWED_ORIGINS
        value: https://app.example.com
      - name: BROWSER_STREAM_SECRET
        from:
          env: BROWSER_STREAM_SECRET
    volumes:
      - puppetflow-puppetflow-framework:/app/storage
      - puppetflow-puppetflow-execution:/app/data/execution
      - puppetflow-puppetflow-uploads:/app/data/storage
  puppetflow-migrate:
