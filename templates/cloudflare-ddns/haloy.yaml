name: cloudflare-ddns
server: localhost
targets:
  cloudflare-ddns:
    preset: service
    image:
      repository: cloudflare-ddns
      tag: latest
      build_config:
        context: ./cloudflare-ddns
        push: server
    port: "8080"
    env:
      - name: CLOUDFLARE_API_TOKEN
        value: <INSERT YOUR TOKEN>
      - name: DOMAINS
        value: example.org,www.example.org,example.io
      - name: PROXIED
        value: "false"
      - name: IP6_PROVIDER
        value: none
