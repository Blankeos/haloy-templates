name: mc-controller
server: localhost
targets:
  mc-controller:
    health_check_path: /api/setup/status
    image: tomhorrorza/mc-controller:${IMAGE_TAG:-1.0.2}
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NODE_ENV
        value: production
      - name: NUXT_MC_RUNTIME
        value: docker
      - name: NUXT_DATABASE_PATH
        value: /data/mc-controller.db
      - name: NUXT_MC_DATA_PATH
        value: /data/servers
      - name: NUXT_DOCKER_SOCKET
        value: /var/run/docker.sock
      - name: NUXT_JWT_SECRET
        from:
          env: JWT_SECRET
      - name: NUXT_MC_BIND_IP
        value: 0.0.0.0
      - name: NUXT_PORT_RANGE_START
        value: "25565"
      - name: NUXT_PORT_RANGE_END
        value: "25600"
    volumes:
      - mc-controller-mc-controller-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
