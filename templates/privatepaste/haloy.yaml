name: privatepaste
server: localhost
targets:
  privatepaste:
    image: ghcr.io/dynamicsninja/privatepaste:0.5.0
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: PP_DB_KEY
        from:
          env: DB_KEY
      - name: PP_PASSWORD
        from:
          env: LOGIN_PASSWORD
      - name: PP_MAX_IMAGE_MB
        value: "20"
      - name: PP_MAX_FILE_MB
        value: "25"
      - name: PP_MAX_TEXT_KB
        value: "1024"
      - name: PP_TRUST_CLOUDFLARE
        value: "false"
    volumes:
      - privatepaste-privatepaste-data:/data
