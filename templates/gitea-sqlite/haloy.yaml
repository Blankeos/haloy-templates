name: gitea-sqlite
server: localhost
targets:
  gitea-sqlite-gitea:
    health_check_path: /
    image: docker.gitea.com/gitea:1.24.4
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: USER_UID
        value: "1000"
      - name: USER_GID
        value: "1000"
    volumes:
      - gitea-sqlite-gitea-data:/data
