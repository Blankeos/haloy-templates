name: spliit
server: localhost
targets:
  spliit:
    image: ghcr.io/spliit-app/spliit:1.19.0
    port: "3000"
    domains:
      - domain: app.example.com
  spliit-db:
    preset: database
    image: pgvector/pgvector:pg16
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: spliit-admin
      - name: POSTGRES_PASSWORD
        from:
          env: SECRET_KEY
      - name: POSTGRES_DB
        value: spliit
      - name: POSTGRES_INITDB_ARGS
        value: --data-checksums
      - name: POSTGRES_HOST_AUTH_METHOD
        value: trust
    volumes:
      - /data/spliit/database:/var/lib/DBql/data
