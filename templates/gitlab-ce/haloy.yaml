name: gitlab-ce
server: localhost
targets:
  gitlab-ce-gitlab:
    image: gitlab/gitlab-ce:19.1.2-ce.0
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: GITLAB_OMNIBUS_CONFIG
        from:
          env: GITLAB_CE_GITLAB__GITLAB_OMNIBUS_CONFIG
    volumes:
      - gitlab-ce-gitlab-config:/etc/gitlab
      - gitlab-ce-gitlab-logs:/var/log/gitlab
      - gitlab-ce-gitlab-data:/var/opt/gitlab
