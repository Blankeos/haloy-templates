name: domain-locker
server: localhost
targets:
  domain-locker-postgres:
    preset: database
    image: postgres:15-alpine
    port: "5432"
    env:
      - name: POSTGRES_DB
        value: domain_locker
      - name: POSTGRES_USER
        value: postgres
      - name: POSTGRES_PASSWORD
        from:
          env: PG_PASSWORD
    volumes:
      - domain-locker-postgres-data:/var/lib/postgresql/data
  domain-locker-app:
    image: lissy93/domain-locker:latest
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NODE_ENV
        value: production
      - name: DL_ENV_TYPE
        value: selfHosted
      - name: DL_PG_HOST
        value: domain-locker-postgres
      - name: DL_PG_PORT
        value: "5432"
      - name: DL_PG_USER
        value: postgres
      - name: DL_PG_PASSWORD
        from:
          env: PG_PASSWORD
      - name: DL_PG_NAME
        value: domain_locker
  domain-locker-updater:
    preset: service
    image:
      repository: domain-locker-updater
      tag: latest
      build_config:
        context: ./domain-locker-updater
        push: server
    port: "8080"
