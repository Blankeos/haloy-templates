name: chromium
server: localhost
targets:
  chromium:
    image: lscr.io/linuxserver/chromium:5f5dd27e-ls102
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: PUID
        value: "1000"
      - name: PGID
        value: "1000"
      - name: TZ
        value: UTC
    volumes:
      - chromium-config:/config
