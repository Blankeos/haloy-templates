name: pairdrop
server: localhost
targets:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: PUID
        value: "1000"
      - name: PGID
        value: "1000"
      - name: TZ
        value: Etc/UTC
    volumes:
      - pairdrop-pairdrop-config:/config
