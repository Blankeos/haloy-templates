name: seanime
server: localhost
targets:
  seanime-init:
    preset: service
    image:
      repository: seanime-init
      tag: latest
      build_config:
        context: ./seanime-init
        push: server
    port: "8080"
    volumes:
      - seanime-seanime-config:/mnt/config
      - seanime-anime:/mnt/anime
      - seanime-downloads:/mnt/downloads
  seanime:
    image: umagistr/seanime:v3.6.1-rootless
    port: "43211"
    domains:
      - domain: app.example.com
    env:
      - name: SEANIME_SERVER_HOST
        value: 0.0.0.0
    volumes:
      - seanime-seanime-config:/home/seanime/.config/Seanime
      - seanime-anime:/anime
      - seanime-downloads:/downloads
