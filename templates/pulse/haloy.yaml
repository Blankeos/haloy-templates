name: pulse
server: localhost
targets:
  pulse:
    health_check_path: /api/health
    image: rcourtman/pulse:5.1
    port: "7655"
    domains:
      - domain: app.example.com
    env:
      - name: PULSE_AUTH_USER
        value: admin
      - name: PULSE_AUTH_PASS
        from:
          env: PULSE_AUTH_PASS
    volumes:
      - pulse-pulse-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
