name: miniflux
server: localhost
targets:
  miniflux:
    image: miniflux/miniflux:2.2.19
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: DATABASE_URL
        from:
          env: MINIFLUX__DATABASE_URL
      - name: RUN_MIGRATIONS
        value: "1"
      - name: CREATE_ADMIN
        value: "1"
      - name: ADMIN_USERNAME
        value: admin
      - name: ADMIN_PASSWORD
        from:
          env: ADMIN_PASSWORD
      - name: BASE_URL
        value: https://app.example.com
  miniflux-db:
    preset: database
    image: postgres:18-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: miniflux
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: miniflux
    volumes:
      - miniflux-miniflux-db:/var/lib/postgresql
