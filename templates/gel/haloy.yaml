name: gel
server: localhost
targets:
  gel:
    preset: service
    image: geldata/gel:6
    port: "5656"
    env:
      - name: GEL_SERVER_SECURITY
        value: strict
      - name: GEL_SERVER_PASSWORD
        from:
          env: GEL_PASSWORD
      - name: GEL_SERVER_TLS_CERT_MODE
        value: generate_self_signed
      - name: GEL_SERVER_HTTP_ENDPOINT_SECURITY
        value: optional
      - name: GEL_SERVER_ADMIN_UI
        value: enabled
    volumes:
      - gel-gel-data:/var/lib/gel/data
  gel-gateway:
    image:
      repository: gel-gateway
      tag: latest
      build_config:
        context: ./gel-gateway
        push: server
    port: "80"
    health_check_path: /_gateway_health
    domains:
      - domain: app.example.com
