name: dockroute
server: localhost
targets:
  dockroute:
    preset: service
    image:
      repository: dockroute
      tag: latest
      build_config:
        context: ./dockroute
        push: server
    port: "8080"
    env:
      - name: DOCKROUTE_PROVIDER
        value: log
      - name: DOCKROUTE_OWNER_ID
        value: default
      - name: DOCKROUTE_POLICY
        value: sync
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
