name: pyrodactyl
server: localhost
targets:
  pyrodactyl-database:
    preset: database
    image:
      repository: pyrodactyl-database
      tag: latest
      build_config:
        context: ./pyrodactyl-database
        push: server
    port: "3306"
    env:
      - name: MYSQL_DATABASE
        value: panel
      - name: MYSQL_USER
        value: pterodactyl
      - name: MYSQL_PASSWORD
        from:
          env: DB_PASSWORD
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: DB_ROOT_PASSWORD
    volumes:
      - pyrodactyl-pterodb:/var/lib/mysql
  pyrodactyl-cache:
    preset: database
    image: redis:alpine
    port: "6379"
  pyrodactyl-panel:
    image: ghcr.io/pyrodactyl-oss/pyrodactyl:latest
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: APP_URL
        value: https://app.example.com
      - name: APP_ENV
        value: production
      - name: APP_ENVIRONMENT_ONLY
        value: "false"
      - name: CACHE_DRIVER
        value: redis
      - name: SESSION_DRIVER
        value: redis
      - name: QUEUE_DRIVER
        value: redis
      - name: REDIS_HOST
        value: pyrodactyl-cache
      - name: DB_HOST
        value: pyrodactyl-database
      - name: DB_PORT
        value: "3306"
      - name: DB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: DB_CONNECTION
        value: mariadb
    volumes:
      - pyrodactyl-pterovar:/app/var/
      - pyrodactyl-pteronginx:/etc/nginx/http.d/
      - pyrodactyl-pterocerts:/etc/letsencrypt/
      - pyrodactyl-pterologs:/app/storage/logs
