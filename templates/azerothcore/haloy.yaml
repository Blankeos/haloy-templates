name: azerothcore
server: localhost
targets:
  azerothcore-database:
    preset: database
    image: mysql:8.4.11
    port: "3306"
    env:
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: MYSQL_ROOT_PASSWORD
    volumes:
      - azerothcore-azerothcore-database:/var/lib/mysql
  azerothcore-db-import:
    preset: service
    image:
      repository: azerothcore-db-import
      tag: latest
      build_config:
        context: ./azerothcore-db-import
        push: server
    port: "8080"
    env:
      - name: AC_DATA_DIR
        value: /azerothcore/env/dist/data
      - name: AC_LOGS_DIR
        value: /azerothcore/env/dist/logs
      - name: AC_LOGIN_DATABASE_INFO
        from:
          env: AZEROTHCORE_DB_IMPORT__AC_LOGIN_DATABASE_INFO
      - name: AC_WORLD_DATABASE_INFO
        from:
          env: AZEROTHCORE_DB_IMPORT__AC_WORLD_DATABASE_INFO
      - name: AC_CHARACTER_DATABASE_INFO
        from:
          env: AZEROTHCORE_DB_IMPORT__AC_CHARACTER_DATABASE_INFO
    volumes:
      - azerothcore-azerothcore-config:/azerothcore/env/dist/etc
      - azerothcore-azerothcore-logs:/azerothcore/env/dist/logs
  azerothcore-client-data:
    preset: service
    image:
      repository: azerothcore-client-data
      tag: latest
      build_config:
        context: ./azerothcore-client-data
        push: server
    port: "8080"
    volumes:
      - azerothcore-azerothcore-client-data:/azerothcore/env/dist/data
  azerothcore-realm-config:
    preset: database
    image:
      repository: azerothcore-realm-config
      tag: latest
      build_config:
        context: ./azerothcore-realm-config
        push: server
    port: "3306"
    env:
      - name: MYSQL_PWD
        from:
          env: MYSQL_ROOT_PASSWORD
      - name: REALM_ADDRESS
        value: app.example.com
  azerothcore-auth:
    preset: service
    image: acore/ac-wotlk-authserver:17.0.0-dev
    port: "3724"
    env:
      - name: AC_LOGS_DIR
        value: /azerothcore/env/dist/logs
      - name: AC_TEMP_DIR
        value: /azerothcore/env/dist/temp
      - name: AC_LOGIN_DATABASE_INFO
        from:
          env: AZEROTHCORE_AUTH__AC_LOGIN_DATABASE_INFO
    volumes:
      - azerothcore-azerothcore-config:/azerothcore/env/dist/etc
      - azerothcore-azerothcore-logs:/azerothcore/env/dist/logs
  azerothcore:
    preset: service
    image: acore/ac-wotlk-worldserver:17.0.0-dev
    port: "8085"
    env:
      - name: AC_DATA_DIR
        value: /azerothcore/env/dist/data
      - name: AC_LOGS_DIR
        value: /azerothcore/env/dist/logs
      - name: AC_LOGIN_DATABASE_INFO
        from:
          env: AZEROTHCORE__AC_LOGIN_DATABASE_INFO
      - name: AC_WORLD_DATABASE_INFO
        from:
          env: AZEROTHCORE__AC_WORLD_DATABASE_INFO
      - name: AC_CHARACTER_DATABASE_INFO
        from:
          env: AZEROTHCORE__AC_CHARACTER_DATABASE_INFO
    volumes:
      - azerothcore-azerothcore-config:/azerothcore/env/dist/etc
      - azerothcore-azerothcore-logs:/azerothcore/env/dist/logs
      - azerothcore-azerothcore-client-data:/azerothcore/env/dist/data:ro
