name: silverbullet
server: localhost
targets:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:v2
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: SB_USER
        from:
          env: SILVERBULLET__SB_USER
    volumes:
      - silverbullet-silverbullet-space:/space
  silverbullet-watchtower:
    preset: service
    image:
      repository: silverbullet-watchtower
      tag: latest
      build_config:
        context: ./silverbullet-watchtower
        push: server
    port: "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
