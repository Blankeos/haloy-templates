name: metabase
server: localhost
targets:
  metabase:
    health_check_path: /api/health
    image: metabase/metabase:v0.63.18
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: MB_DB_TYPE
        value: postgres
      - name: MB_DB_DBNAME
        value: metabaseappdb
      - name: MB_DB_PORT
        value: "5432"
      - name: MB_DB_USER
        value: metabase
      - name: MB_DB_PASS
        from:
          env: POSTGRES_PASSWORD
      - name: MB_DB_HOST
        value: metabase-postgres
    volumes:
      - /dev/urandom:/dev/random:ro
  metabase-postgres:
    preset: database
    image: postgres:16
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: metabase
      - name: POSTGRES_DB
        value: metabaseappdb
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
    volumes:
      - metabase-postgres-data:/var/lib/postgresql/data
