name: ojs
server: localhost
targets:
  ojs-db:
    preset: database
    image: mariadb:11.4
    port: "3306"
    env:
      - name: MYSQL_ROOT_PASSWORD
        from:
          env: MYSQL_ROOT_PASSWORD
      - name: MYSQL_DATABASE
        value: ojs
      - name: MYSQL_USER
        value: ojs
      - name: MYSQL_PASSWORD
        from:
          env: OJS_DB_PASSWORD
    volumes:
      - ojs-ojs-db-data:/var/lib/mysql
  ojs:
    image: pkpofficial/ojs:3_3_0-21
    port: "80"
    domains:
      - domain: app.example.com
    volumes:
      - /etc/localtime:/etc/localtime
      - ojs-ojs-private-files:/var/www/files
      - ojs-ojs-public-files:/var/www/html/public
