name: markup
server: localhost
targets:
  markup-db:
    preset: database
    image: postgres:16-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: markup
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: markup
    volumes:
      - markup-markup-postgres-data:/var/lib/postgresql/data
  markup:
    image: ghcr.io/pphilfre/markup:main
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: DATABASE_URL
        from:
          env: MARKUP__DATABASE_URL
      - name: NEXT_PUBLIC_DB_PROVIDER
        value: postgres
      - name: NEXT_PUBLIC_SITE_URL
        value: https://app.example.com
      - name: WORKOS_CLIENT_ID
        value: client_id_change_me
      - name: WORKOS_API_KEY
        value: sk_change_me
      - name: WORKOS_COOKIE_PASSWORD
        from:
          env: COOKIE_PASSWORD
      - name: NEXT_PUBLIC_WORKOS_REDIRECT_URI
        value: https://app.example.com/callback
      - name: NODE_ENV
        value: production
