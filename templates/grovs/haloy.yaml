      - name: SMTP_ENABLE_STARTTLS_AUTO
        value: "true"
      - name: SMTP_PORT
        value: "587"
      - name: WEB_CONCURRENCY
        value: "2"
    volumes:
      - grovs-storage:/app/storage
  grovs-dashboard:
    image: ghcr.io/grovs-io/dashboard:2.3.1
    port: "3000"
    domains:
      - domain: dashboard.app.example.com
    env:
      - name: API_URL
        value: https://api.app.example.com
      - name: OAUTH_CLIENT_UID
        from:
          env: OAUTH_CLIENT_UID
      - name: OAUTH_CLIENT_SECRET
        from:
          env: OAUTH_CLIENT_SECRET
      - name: HOSTNAME
        value: 0.0.0.0
      - name: PORT
        value: "3000"
