      - name: GO_HOST
        value: go.app.example.com
      - name: GROVS_EE
        value: "false"
      - name: GROVS_SELF_HOSTED
        value: "true"
      - name: LINKS_PROD_HOST
        value: links.app.example.com
      - name: LINKS_TEST_HOST
        value: links.test.app.example.com
      - name: MAILER_FROM
        value: Grovs <noreply@app.example.com>
      - name: MCP_CONSENT_URL
