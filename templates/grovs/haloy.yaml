name: grovs
server: localhost
targets:
  grovs-postgres:
    preset: database
    image:
      repository: grovs-postgres
      tag: latest
      build_config:
        context: ./grovs-postgres
        push: server
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: grovs
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: POSTGRES_DB
        value: grovs_production
    volumes:
      - grovs-pg-data:/var/lib/postgresql/data
  grovs-redis:
    preset: database
    image:
      repository: grovs-redis
      tag: latest
      build_config:
        context: ./grovs-redis
        push: server
    port: "6379"
    volumes:
      - grovs-redis-data:/data
  grovs-clickhouse:
    health_check_path: /ping
    preset: database
    image: clickhouse/clickhouse-server:25.3.6.56
    port: "8123"
    env:
      - name: CLICKHOUSE_DB
        value: grovs_production
      - name: CLICKHOUSE_USER
        value: grovs
      - name: CLICKHOUSE_PASSWORD
        from:
          env: CLICKHOUSE_PASSWORD
    volumes:
      - grovs-clickhouse-data:/var/lib/clickhouse
  grovs-migrate:
    preset: service
    image:
      repository: grovs-migrate
      tag: latest
      build_config:
        context: ./grovs-migrate
        push: server
    port: "8080"
    env:
      - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        from:
          env: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        from:
          env: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        from:
          env: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      - name: ACTIVE_STORAGE_SERVICE
        value: local
      - name: ADMIN_API_KEY
        from:
          env: ADMIN_API_KEY
      - name: API_HOST
        value: api.app.example.com
      - name: BOOTSTRAP_ADMIN_EMAIL
        value: admin@app.example.com
      - name: BOOTSTRAP_ADMIN_PASSWORD
        from:
          env: BOOTSTRAP_ADMIN_PASSWORD
      - name: CLICKHOUSE_ANALYTICS_ROLLUPS_READ_ENABLED
        value: "true"
      - name: CLICKHOUSE_ATTRIBUTION_READ_ENABLED
        value: "true"
      - name: CLICKHOUSE_DATABASE
        value: grovs_production
      - name: CLICKHOUSE_LINK_DIMENSIONS_READ_ENABLED
        value: "true"
      - name: CLICKHOUSE_PASSWORD
        from:
          env: CLICKHOUSE_PASSWORD
      - name: CLICKHOUSE_PRIMARY
        value: "true"
      - name: CLICKHOUSE_READ_ENABLED
        value: "true"
      - name: CLICKHOUSE_ROLLUP_FAST_LANE
        value: "true"
      - name: CLICKHOUSE_URL
        from:
          env: GROVS_MIGRATE__CLICKHOUSE_URL
      - name: CLICKHOUSE_WRITE_ENABLED
        value: "true"
      - name: DASHBOARD_CACHE_TTL_SECONDS
        value: "60"
      - name: DASHBOARD_HOST
        value: dashboard.app.example.com
      - name: DATABASE_URL
        from:
          env: GROVS_MIGRATE__DATABASE_URL
      - name: DEFAULT_LINK_SUBTITLE
        value: Dynamic links, attributions, and referrals across mobile and web platforms.
      - name: DEFAULT_LINK_TITLE
        value: grovs
      - name: DEFAULT_LOGO_URL
        value: https://appssemble-assets.s3.eu-north-1.amazonaws.com/linksquared/logo-square-new.svg
      - name: DEFAULT_SOCIAL_PREVIEW_URL
        value: https://appssemble-assets.s3.eu-north-1.amazonaws.com/linksquared/social-media-placeholder.jpg
      - name: DIAGNOSTICS_API_KEY
