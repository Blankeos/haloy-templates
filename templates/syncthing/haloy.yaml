name: syncthing
server: localhost
targets:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    port: "8384"
    domains:
      - domain: app.example.com
    env:
      - name: PUID
        value: "1000"
      - name: PGID
        value: "1000"
      - name: TZ
        value: America/Sao_Paulo
    volumes:
      - syncthing-syncthing-config:/config
      - syncthing-syncthing-data:/var/syncthing/Sync
