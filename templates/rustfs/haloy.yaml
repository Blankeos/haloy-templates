name: rustfs
server: localhost
targets:
  rustfs:
    image:
      repository: rustfs
      tag: latest
      build_config:
        context: ./rustfs
        push: server
    port: "9001"
    domains:
      - domain: app.example.com
    env:
      - name: RUSTFS_ACCESS_KEY
        value: rustfsadmin
      - name: RUSTFS_SECRET_KEY
        from:
          env: SECRET_KEY
      - name: RUSTFS_ADDRESS
        value: 0.0.0.0:9000
      - name: RUSTFS_CONSOLE_ADDRESS
        value: 0.0.0.0:9001
      - name: RUSTFS_CONSOLE_ENABLE
        value: "true"
      - name: RUSTFS_CORS_ALLOWED_ORIGINS
        value: "*"
      - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
        value: "*"
    volumes:
      - rustfs-rustfs-data:/data
