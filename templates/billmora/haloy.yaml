name: billmora
server: localhost
targets:
  billmora-app:
    image: ghcr.io/billmora/billmora:latest
    port: "8080"
    domains:
      - domain: app.example.com
    env:
      - name: APP_NAME
        value: Billmora
      - name: APP_ENV
        value: production
      - name: APP_KEY
        from:
          env: BILLMORA_APP__APP_KEY
      - name: APP_URL
        value: https://app.example.com
      - name: DB_CONNECTION
        value: mariadb
      - name: DB_HOST
        value: billmora-db
      - name: DB_PORT
        value: "3306"
      - name: DB_DATABASE
        value: billmora
      - name: DB_USERNAME
        value: billmora
      - name: DB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: REDIS_HOST
        value: billmora-redis
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
      - name: REDIS_PORT
        value: "6379"
      - name: SESSION_DRIVER
        value: redis
      - name: CACHE_STORE
        value: redis
      - name: QUEUE_CONNECTION
        value: redis
      - name: AUTORUN_ENABLED
        value: "true"
      - name: AUTORUN_LARAVEL_MIGRATION
        value: "true"
      - name: AUTORUN_LARAVEL_MIGRATION_FORCE
        value: "true"
      - name: AUTORUN_LARAVEL_MIGRATION_SEED
        value: "true"
      - name: AUTORUN_LARAVEL_STORAGE_LINK
        value: "true"
    volumes:
      - billmora-billmora-storage:/var/www/html/storage
      - billmora-billmora-plugins:/var/www/html/plugin
      - billmora-billmora-themes-resources:/var/www/html/resources/themes
      - billmora-billmora-themes-public:/var/www/html/public/themes
  billmora-worker:
    preset: service
    image:
      repository: billmora-worker
      tag: latest
      build_config:
        context: ./billmora-worker
        push: server
    port: "8080"
    env:
      - name: APP_NAME
        value: Billmora
      - name: APP_ENV
        value: production
      - name: APP_KEY
        from:
          env: BILLMORA_WORKER__APP_KEY
      - name: APP_URL
        value: https://app.example.com
      - name: DB_CONNECTION
        value: mariadb
      - name: DB_HOST
        value: billmora-db
      - name: DB_PORT
        value: "3306"
      - name: DB_DATABASE
        value: billmora
      - name: DB_USERNAME
        value: billmora
      - name: DB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: REDIS_HOST
        value: billmora-redis
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
      - name: REDIS_PORT
        value: "6379"
      - name: SESSION_DRIVER
        value: redis
      - name: CACHE_STORE
        value: redis
      - name: QUEUE_CONNECTION
        value: redis
      - name: AUTORUN_ENABLED
        value: "false"
    volumes:
      - billmora-billmora-storage:/var/www/html/storage
      - billmora-billmora-plugins:/var/www/html/plugin
      - billmora-billmora-themes-resources:/var/www/html/resources/themes
      - billmora-billmora-themes-public:/var/www/html/public/themes
  billmora-scheduler:
    preset: service
    image:
      repository: billmora-scheduler
      tag: latest
      build_config:
        context: ./billmora-scheduler
        push: server
    port: "8080"
    env:
      - name: APP_NAME
        value: Billmora
      - name: APP_ENV
        value: production
      - name: APP_KEY
        from:
          env: BILLMORA_SCHEDULER__APP_KEY
      - name: APP_URL
        value: https://app.example.com
      - name: DB_CONNECTION
        value: mariadb
      - name: DB_HOST
        value: billmora-db
      - name: DB_PORT
        value: "3306"
      - name: DB_DATABASE
        value: billmora
      - name: DB_USERNAME
        value: billmora
      - name: DB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: REDIS_HOST
        value: billmora-redis
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
      - name: REDIS_PORT
        value: "6379"
      - name: SESSION_DRIVER
        value: redis
      - name: CACHE_STORE
        value: redis
      - name: QUEUE_CONNECTION
        value: redis
      - name: AUTORUN_ENABLED
        value: "false"
    volumes:
      - billmora-billmora-storage:/var/www/html/storage
      - billmora-billmora-plugins:/var/www/html/plugin
      - billmora-billmora-themes-resources:/var/www/html/resources/themes
      - billmora-billmora-themes-public:/var/www/html/public/themes
  billmora-db:
    preset: database
    image: mariadb:11
    port: "3306"
    env:
      - name: MARIADB_DATABASE
        value: billmora
      - name: MARIADB_USER
        value: billmora
      - name: MARIADB_PASSWORD
        from:
          env: DB_PASSWORD
      - name: MARIADB_ROOT_PASSWORD
        from:
          env: DB_ROOT_PASSWORD
    volumes:
      - billmora-billmora-db-data:/var/lib/mysql
  billmora-redis:
    preset: database
    image:
      repository: billmora-redis
      tag: latest
      build_config:
        context: ./billmora-redis
        push: server
    port: "6379"
    env:
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
    volumes:
      - billmora-billmora-redis-data:/data
