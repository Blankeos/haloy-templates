name: dify
server: localhost
targets:
  dify-nginx:
    image:
      repository: dify-nginx
      tag: latest
      build_config:
        context: ./dify-nginx
        push: server
    port: "80"
    domains:
      - domain: app.example.com
  dify-init-permissions:
    preset: service
    image:
      repository: dify-init-permissions
      tag: latest
      build_config:
        context: ./dify-init-permissions
        push: server
    port: "8080"
    volumes:
      - dify-dify-app-storage:/app/api/storage
  dify-api:
    health_check_path: /health
    preset: service
    image:
      repository: dify-api
      tag: latest
      build_config:
        context: ./dify-api
        push: server
    port: "8080"
    env:
      - name: LOG_LEVEL
        value: INFO
      - name: DEPLOY_ENV
        value: PRODUCTION
      - name: SECRET_KEY
        from:
          env: SECRET_KEY
      - name: MIGRATION_ENABLED
        value: "true"
      - name: CONSOLE_API_URL
        value: https://app.example.com
      - name: CONSOLE_WEB_URL
        value: https://app.example.com
      - name: SERVICE_API_URL
        value: https://app.example.com
      - name: APP_API_URL
        value: https://app.example.com
      - name: APP_WEB_URL
        value: https://app.example.com
      - name: FILES_URL
        value: https://app.example.com
      - name: INTERNAL_FILES_URL
        value: http://dify-api:5001
      - name: TRIGGER_URL
        value: https://app.example.com
      - name: ENDPOINT_URL_TEMPLATE
        value: https://app.example.com/e/{hook_id}
      - name: ENABLE_COLLABORATION_MODE
        value: "false"
      - name: WEB_API_CORS_ALLOW_ORIGINS
        value: "*"
      - name: CONSOLE_CORS_ALLOW_ORIGINS
        value: "*"
      - name: DB_USERNAME
        value: postgres
      - name: DB_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: DB_HOST
        value: dify-db
      - name: DB_PORT
        value: "5432"
      - name: DB_DATABASE
        value: dify
      - name: REDIS_HOST
        value: dify-redis
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
      - name: REDIS_DB
        value: "0"
      - name: CELERY_BROKER_URL
        from:
          env: DIFY_API__CELERY_BROKER_URL
      - name: STORAGE_TYPE
        value: opendal
      - name: OPENDAL_SCHEME
        value: fs
      - name: OPENDAL_FS_ROOT
        value: storage
      - name: VECTOR_STORE
        value: pgvector
      - name: PGVECTOR_HOST
        value: dify-db
      - name: PGVECTOR_PORT
        value: "5432"
      - name: PGVECTOR_USER
        value: postgres
      - name: PGVECTOR_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: PGVECTOR_DATABASE
        value: dify
      - name: PGVECTOR_MIN_CONNECTION
        value: "1"
      - name: PGVECTOR_MAX_CONNECTION
        value: "5"
      - name: CODE_EXECUTION_ENDPOINT
        value: http://dify-sandbox:8194
      - name: CODE_EXECUTION_API_KEY
        from:
          env: SANDBOX_API_KEY
      - name: SSRF_PROXY_HTTP_URL
        value: http://dify-ssrf-proxy:3128
      - name: SSRF_PROXY_HTTPS_URL
        value: http://dify-ssrf-proxy:3128
      - name: PLUGIN_DAEMON_URL
        value: http://dify-plugin-daemon:5002
      - name: PLUGIN_DAEMON_KEY
        from:
          env: PLUGIN_DAEMON_KEY
      - name: INNER_API_KEY_FOR_PLUGIN
        from:
          env: PLUGIN_INNER_API_KEY
      - name: PLUGIN_MAX_PACKAGE_SIZE
        value: "52428800"
      - name: PLUGIN_REMOTE_INSTALL_HOST
        value: localhost
      - name: PLUGIN_REMOTE_INSTALL_PORT
        value: "5003"
      - name: MARKETPLACE_ENABLED
        value: "true"
      - name: MARKETPLACE_API_URL
        value: https://marketplace.dify.ai
      - name: MODE
        value: api
    volumes:
      - dify-dify-app-storage:/app/api/storage
  dify-worker:
    preset: service
    image:
      repository: dify-worker
      tag: latest
      build_config:
        context: ./dify-worker
        push: server
    port: "8080"
    env:
      - name: LOG_LEVEL
        value: INFO
      - name: DEPLOY_ENV
        value: PRODUCTION
      - name: SECRET_KEY
        from:
          env: SECRET_KEY
      - name: MIGRATION_ENABLED
        value: "true"
      - name: CONSOLE_API_URL
        value: https://app.example.com
      - name: CONSOLE_WEB_URL
        value: https://app.example.com
      - name: SERVICE_API_URL
        value: https://app.example.com
      - name: APP_API_URL
        value: https://app.example.com
      - name: APP_WEB_URL
        value: https://app.example.com
      - name: FILES_URL
        value: https://app.example.com
      - name: INTERNAL_FILES_URL
        value: http://dify-api:5001
      - name: TRIGGER_URL
        value: https://app.example.com
      - name: ENDPOINT_URL_TEMPLATE
        value: https://app.example.com/e/{hook_id}
      - name: ENABLE_COLLABORATION_MODE
        value: "false"
      - name: WEB_API_CORS_ALLOW_ORIGINS
        value: "*"
      - name: CONSOLE_CORS_ALLOW_ORIGINS
        value: "*"
      - name: DB_USERNAME
        value: postgres
      - name: DB_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: DB_HOST
        value: dify-db
      - name: DB_PORT
        value: "5432"
      - name: DB_DATABASE
        value: dify
      - name: REDIS_HOST
        value: dify-redis
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_PASSWORD
        from:
          env: REDIS_PASSWORD
      - name: REDIS_DB
        value: "0"
      - name: CELERY_BROKER_URL
        from:
