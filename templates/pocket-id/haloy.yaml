name: pocket-id
server: localhost
targets:
  pocket-id:
    image: pocketid/pocket-id:v2.14.0
    port: "1411"
    domains:
      - domain: app.example.com
    env:
      - name: APP_URL
        value: https://app.example.com
      - name: ENCRYPTION_KEY
        from:
          env: ENCRYPTION_KEY
      - name: TRUST_PROXY
        value: "true"
    volumes:
      - pocket-id-pocket-id-data:/app/data
