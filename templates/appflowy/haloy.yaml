name: appflowy
server: localhost
targets:
  appflowy-nginx:
    image: nginx
    port: "80"
    domains:
      - domain: app.example.com
  appflowy-minio:
    preset: service
    image:
      repository: appflowy-minio
      tag: latest
      build_config:
        context: ./appflowy-minio
        push: server
    port: "8080"
    env:
      - name: MINIO_BROWSER_REDIRECT_URL
        value: https://app.example.com/minio
      - name: MINIO_ROOT_USER
        from:
          env: INLINE_PASSWORD_16
      - name: MINIO_ROOT_PASSWORD
        from:
          env: INLINE_PASSWORD_32
    volumes:
      - appflowy-minio-data:/data
  appflowy-postgres:
    preset: database
    image: pgvector/pgvector:pg16
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: appflowy
      - name: POSTGRES_DB
        value: appflowy
      - name: POSTGRES_PASSWORD
        from:
          env: INLINE_PASSWORD_64
      - name: POSTGRES_HOST
        value: appflowy-postgres
    volumes:
      - appflowy-postgres-data:/var/lib/postgresql/data
      - appflowy-files-volumes-postgres:/docker-entrypoint-initdb.d/
  appflowy-redis:
    preset: database
    image: redis
    port: "6379"
  appflowy-gotrue:
    health_check_path: /health
    preset: service
    image: appflowyinc/gotrue:${GOTRUE_VERSION:-latest}
    port: "8080"
    env:
      - name: GOTRUE_ADMIN_EMAIL
        value: admin@app.example.com
      - name: GOTRUE_ADMIN_PASSWORD
        from:
          env: INLINE_PASSWORD_16
      - name: GOTRUE_DISABLE_SIGNUP
        value: "false"
      - name: GOTRUE_SITE_URL
        value: appflowy-flutter://
      - name: GOTRUE_URI_ALLOW_LIST
        value: "**"
      - name: API_EXTERNAL_URL
        value: https://app.example.com/gotrue
      - name: GOTRUE_JWT_SECRET
        from:
          env: INLINE_PASSWORD_64
      - name: GOTRUE_JWT_EXP
        value: "7200"
      - name: GOTRUE_JWT_ADMIN_GROUP_NAME
        value: supabase_admin
      - name: GOTRUE_DB_DRIVER
        value: postgres
      - name: DATABASE_URL
        from:
          env: APPFLOWY_GOTRUE__DATABASE_URL
      - name: PORT
        value: "9999"
      - name: GOTRUE_SMTP_PORT
        value: "465"
      - name: GOTRUE_SMTP_ADMIN_EMAIL
        value: admin@app.example.com
      - name: GOTRUE_SMTP_MAX_FREQUENCY
        value: 1ns
      - name: GOTRUE_RATE_LIMIT_EMAIL_SENT
        value: "100"
      - name: GOTRUE_MAILER_AUTOCONFIRM
        value: "true"
      - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
        value: /gotrue/verify
      - name: GOTRUE_MAILER_URLPATHS_INVITE
        value: /gotrue/verify
      - name: GOTRUE_MAILER_URLPATHS_RECOVERY
        value: /gotrue/verify
      - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
        value: /gotrue/verify
      - name: GOTRUE_EXTERNAL_GOOGLE_ENABLED
        value: "false"
      - name: GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI
        value: https://app.example.com/gotrue/callback
      - name: GOTRUE_EXTERNAL_GITHUB_ENABLED
        value: "false"
      - name: GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI
        value: https://app.example.com/gotrue/callback
      - name: GOTRUE_EXTERNAL_DISCORD_ENABLED
        value: "false"
      - name: GOTRUE_EXTERNAL_DISCORD_REDIRECT_URI
        value: https://app.example.com/gotrue/callback
      - name: GOTRUE_SAML_ENABLED
        value: "false"
  appflowy-cloud:
    preset: service
    image: appflowyinc/appflowy_cloud:${APPFLOWY_CLOUD_VERSION:-latest}
    port: "8080"
    env:
      - name: RUST_LOG
        value: info
      - name: APPFLOWY_ENVIRONMENT
        value: production
      - name: APPFLOWY_DATABASE_URL
        from:
          env: APPFLOWY_CLOUD__APPFLOWY_DATABASE_URL
      - name: APPFLOWY_REDIS_URI
        value: redis://appflowy-redis:6379
      - name: APPFLOWY_WEB_URL
        value: https://app.example.com
      - name: APPFLOWY_GOTRUE_JWT_SECRET
        from:
          env: INLINE_PASSWORD_64
      - name: APPFLOWY_GOTRUE_JWT_EXP
        value: "7200"
      - name: APPFLOWY_GOTRUE_BASE_URL
        value: http://appflowy-gotrue:9999
      - name: APPFLOWY_S3_CREATE_BUCKET
        value: "true"
      - name: APPFLOWY_S3_USE_MINIO
        value: "true"
      - name: APPFLOWY_S3_MINIO_URL
        value: http://appflowy-minio:9000
      - name: APPFLOWY_S3_ACCESS_KEY
        from:
          env: INLINE_PASSWORD_16
      - name: APPFLOWY_S3_SECRET_KEY
        from:
          env: INLINE_PASSWORD_32
      - name: APPFLOWY_S3_BUCKET
        value: appflowy
      - name: APPFLOWY_S3_REGION
        value: us-east-1
      - name: APPFLOWY_S3_PRESIGNED_URL_ENDPOINT
        value: https://app.example.com/minio-api
      - name: APPFLOWY_MAILER_SMTP_PORT
        value: "465"
      - name: APPFLOWY_MAILER_SMTP_TLS_KIND
        value: wrapper
      - name: APPFLOWY_ACCESS_CONTROL
        value: "true"
      - name: APPFLOWY_DATABASE_MAX_CONNECTIONS
        value: "40"
      - name: APPFLOWY_WEBSOCKET_MAILBOX_SIZE
        value: "6000"
      - name: AI_SERVER_HOST
        value: appflowy-ai
      - name: AI_SERVER_PORT
        value: "5001"
  appflowy-admin-frontend:
    preset: service
    image: appflowyinc/admin_frontend:${APPFLOWY_ADMIN_FRONTEND_VERSION:-latest}
    port: "8080"
    env:
      - name: RUST_LOG
        value: info
      - name: ADMIN_FRONTEND_REDIS_URL
        value: redis://appflowy-redis:6379
      - name: ADMIN_FRONTEND_GOTRUE_URL
        value: http://appflowy-gotrue:9999
      - name: ADMIN_FRONTEND_APPFLOWY_CLOUD_URL
        value: http://appflowy-cloud:8000
      - name: ADMIN_FRONTEND_PATH_PREFIX
        value: /console
  appflowy-ai:
    health_check_path: /health
    preset: service
    image: appflowyinc/appflowy_ai:${APPFLOWY_AI_VERSION:-latest}
    port: "8080"
    env:
      - name: AI_SERVER_PORT
        value: "5001"
      - name: DEFAULT_AI_MODEL
        value: gpt-4o-mini
      - name: DEFAULT_AI_COMPLETION_MODEL
        value: gpt-4o-mini
      - name: AI_DATABASE_URL
        from:
          env: APPFLOWY_AI__AI_DATABASE_URL
      - name: AI_REDIS_URL
        value: redis://appflowy-redis:6379
      - name: APPFLOWY_S3_ACCESS_KEY
        from:
          env: INLINE_PASSWORD_16
      - name: APPFLOWY_S3_SECRET_KEY
        from:
          env: INLINE_PASSWORD_32
      - name: APPFLOWY_S3_BUCKET
        value: appflowy
      - name: APPFLOWY_S3_REGION
        value: us-east-1
      - name: AI_USE_MINIO
        value: "true"
      - name: AI_MINIO_URL
        value: http://appflowy-minio:9000
      - name: AI_APPFLOWY_HOST
        value: https://app.example.com
      - name: APPFLOWY_GOTRUE_JWT_SECRET
        from:
          env: INLINE_PASSWORD_64
  appflowy-worker:
    preset: service
    image: appflowyinc/appflowy_worker:${APPFLOWY_WORKER_VERSION:-latest}
    port: "8080"
    env:
      - name: RUST_LOG
        value: info
      - name: APPFLOWY_ENVIRONMENT
        value: production
      - name: APPFLOWY_WORKER_REDIS_URL
        value: redis://appflowy-redis:6379
      - name: APPFLOWY_WORKER_ENVIRONMENT
        value: production
      - name: APPFLOWY_WORKER_DATABASE_URL
        from:
          env: APPFLOWY_WORKER__APPFLOWY_WORKER_DATABASE_URL
      - name: APPFLOWY_WORKER_DATABASE_NAME
        value: appflowy
      - name: APPFLOWY_WORKER_IMPORT_TICK_INTERVAL
        value: "30"
      - name: APPFLOWY_S3_USE_MINIO
        value: "true"
      - name: APPFLOWY_S3_MINIO_URL
        value: http://appflowy-minio:9000
      - name: APPFLOWY_S3_ACCESS_KEY
        from:
          env: INLINE_PASSWORD_16
      - name: APPFLOWY_S3_SECRET_KEY
        from:
          env: INLINE_PASSWORD_32
      - name: APPFLOWY_S3_BUCKET
        value: appflowy
      - name: APPFLOWY_S3_REGION
        value: us-east-1
      - name: APPFLOWY_MAILER_SMTP_PORT
        value: "465"
      - name: APPFLOWY_MAILER_SMTP_TLS_KIND
        value: wrapper
  appflowy-web:
    preset: service
    image: appflowyinc/appflowy_web:${APPFLOWY_WEB_VERSION:-latest}
    port: "8080"
    env:
      - name: AF_BASE_URL
        value: https://app.example.com
      - name: AF_GOTRUE_URL
        value: https://app.example.com/gotrue
      - name: AF_WS_V2_URL
        value: wss://app.example.com/ws/v2
