name: yuvomi
server: localhost
targets:
  yuvomi:
    health_check_path: /health
    image: ghcr.io/ulsklyc/yuvomi:2.80.0
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: NODE_ENV
        value: production
      - name: DB_PATH
        value: /data/yuvomi.db
      - name: BACKUP_DIR
        value: /backups
      - name: DOCUMENT_STORAGE_LOCAL_ENABLED
        value: "false"
      - name: DOCUMENT_STORAGE_LOCAL_PATH
        value: /documents
      - name: SESSION_SECURE
        value: "true"
      - name: TRUST_PROXY
        value: "1"
      - name: SESSION_SECRET
        from:
          env: SESSION_SECRET
      - name: DB_ENCRYPTION_KEY
        from:
          env: DB_ENCRYPTION_KEY
    volumes:
      - yuvomi-yuvomi-data:/data
      - yuvomi-yuvomi-backups:/backups
      - yuvomi-yuvomi-modules:/app/modules
      - yuvomi-yuvomi-documents:/documents
