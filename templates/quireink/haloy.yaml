name: quireink
server: localhost
targets:
  quireink:
    image: quireink/quireink:2.2.1
    port: "3000"
    domains:
      - domain: app.example.com
    env:
      - name: SITE_URL
        value: https://app.example.com
    volumes:
      - quireink-quireink-data:/var/lib/quire/data
      - quireink-quireink-uploads:/var/lib/quire/uploads
