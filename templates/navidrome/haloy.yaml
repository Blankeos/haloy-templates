name: navidrome
server: localhost
targets:
  navidrome:
    image: deluan/navidrome:latest
    port: "4533"
    domains:
      - domain: app.example.com
    env:
      - name: ND_SCANSCHEDULE
        value: 1h
      - name: ND_LOGLEVEL
        value: info
      - name: ND_SESSIONTIMEOUT
        value: 24h
    volumes:
      - navidrome-navidrome-data:/data
      - navidrome-navidrome-music:/music:ro
