name: pretix
server: localhost
targets:
  pretix:
    image:
      repository: pretix
      tag: latest
      build_config:
        context: ./pretix
        push: server
    port: "80"
    domains:
      - domain: app.example.com
    env:
      - name: PRETIX_PRETIX_INSTANCE_NAME
        value: pretix
      - name: PRETIX_PRETIX_URL
        value: https://app.example.com
      - name: PRETIX_PRETIX_CURRENCY
        value: EUR
      - name: PRETIX_PRETIX_DATADIR
        value: /data
      - name: PRETIX_PRETIX_TRUST_X_FORWARDED_FOR
        value: on
      - name: PRETIX_PRETIX_TRUST_X_FORWARDED_PROTO
        value: on
      - name: PRETIX_DJANGO_SECRET
        from:
          env: SECRET_KEY
      - name: PRETIX_DATABASE_BACKEND
        value: postgresql
      - name: PRETIX_DATABASE_NAME
        value: pretix
      - name: PRETIX_DATABASE_USER
        value: pretix
      - name: PRETIX_DATABASE_PASSWORD
        from:
          env: POSTGRES_PASSWORD
      - name: PRETIX_DATABASE_HOST
        value: pretix-postgres
      - name: PRETIX_DATABASE_PORT
        value: "5432"
      - name: PRETIX_REDIS_LOCATION
        value: redis://pretix-redis:6379/0
      - name: PRETIX_REDIS_SESSIONS
        value: "true"
      - name: PRETIX_CELERY_BACKEND
        value: redis://pretix-redis:6379/1
      - name: PRETIX_CELERY_BROKER
        value: redis://pretix-redis:6379/2
      - name: PRETIX_MAIL_FROM
        value: tickets@example.com
      - name: PRETIX_MAIL_HOST
        value: localhost
      - name: PRETIX_MAIL_PORT
        value: "25"
      - name: PRETIX_MAIL_TLS
        value: "false"
    volumes:
      - pretix-pretix-data:/data
      - pretix-pretix-config:/etc/pretix
  pretix-postgres:
    preset: database
    image: postgres:16-alpine
    port: "5432"
    env:
      - name: POSTGRES_USER
        value: pretix
      - name: POSTGRES_DB
        value: pretix
      - name: POSTGRES_PASSWORD
        from:
          env: POSTGRES_PASSWORD
    volumes:
      - pretix-pretix-postgres:/var/lib/postgresql/data
  pretix-redis:
    preset: database
    image: redis:7-alpine
    port: "6379"
    volumes:
      - pretix-pretix-redis:/data
